    steps,summary:'\\('+Y+'='+fd(a)+'\\cdot '+X+(b.sign()<0?' - '+fd(b.abs()):' + '+fd(b))+'\\); odpovědi '+fmtDec(y3,false)+' '+tpl.uy+', '+fmtDec(x4,false)+' '+tpl.ux,
    printTask:'Urči předpis a odpověz: '+tpl.q3(D)+' '+tpl.q4(D),data:{a,b,y3,x4}};
}
function genWord(rng,diff=2){
  const pool=WORD_T.filter(t=>t.lvl<=diff+(diff===1?0:1));
  for(let t=0;t<500;t++){
    const tpl=rng.pick(pool); const d=tpl.gen(rng);
    if(d.xs[0]===d.xs[1]) continue;
    if(d.x3===d.xs[0]||d.x3===d.xs[1]) continue;
    const a=F.of(d.a), y4=a.mul(d.x4).add(d.b);
    if(tpl.id==='cesta'&&y4.sign()<=0) continue;
    if(tpl.id==='svicka'&&(y4.sign()<=0||a.mul(d.x3).add(d.b).sign()<=0)) continue;
    if(tpl.id==='cesta'&&a.mul(d.x3).add(d.b).sign()<=0) continue;
    return buildWord(tpl,d,diff);
  }
  throw new Error('genWord');
}

/* ---------- parser výrazů (pro zjednodušené výrazy od žáka) ---------- */
function parseExpr(str,v){
  const s=String(str==null?'':str).replace(/[\u2212\u2013]/g,'-').replace(/[·×⋅*]/g,'*').replace(/:/g,'/').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'');
  if(s==='') throw new Error('Nic jsi nevyplnil.');
  const toks=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j])) j++;const val=parseFloat(s.slice(i,j));if(isNaN(val)) throw new Error('Nerozumím číslu „'+s.slice(i,j)+'“.');toks.push({t:'n',v:val});i=j;continue;}
    if(c===v){toks.push({t:'v'});i++;continue;}
    if('+-*/^()'.includes(c)){toks.push({t:c});i++;continue;}
    if(c==='['||c==='{'){toks.push({t:'('});i++;continue;}
    if(c===']'||c==='}'){toks.push({t:')'});i++;continue;}
    throw new Error('Neznámý znak „'+c+'“. Používej '+v+', čísla, + − · / ^ a závorky.');
  }
  const out=[];
  for(const b of toks){const a=out[out.length-1];if(a&&(a.t==='n'||a.t==='v'||a.t===')')&&(b.t==='n'||b.t==='v'||b.t==='(')) out.push({t:'*'});out.push(b);}
  let p=0; const peek=()=>out[p]; const eat=t=>{if(out[p]&&out[p].t===t){p++;return true;}return false;};
  function expr(){let f=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=out[p++].t,g=term(),f0=f;f=op==='+'?x=>f0(x)+g(x):x=>f0(x)-g(x);}return f;}
  function term(){let f=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=out[p++].t,g=unary(),f0=f;f=op==='*'?x=>f0(x)*g(x):x=>f0(x)/g(x);}return f;}
  function unary(){if(eat('-')){const g=unary();return x=>-g(x);}if(eat('+')) return unary();return power();}
  function power(){const b=atom();if(eat('^')){const e=unary();return x=>Math.pow(b(x),e(x));}return b;}
  function atom(){const tk=out[p];if(!tk) throw new Error('Výraz je neúplný.');p++;
    if(tk.t==='n'){const val=tk.v;return ()=>val;}
    if(tk.t==='v') return x=>x;
    if(tk.t==='('){const f=expr();if(!eat(')')) throw new Error('Chybí uzavírací závorka.');return f;}
    throw new Error('Na tomhle místě nečekám „'+tk.t+'“.');}
  const f=expr();
  if(p<out.length) throw new Error('Výraz se nepodařilo přečíst celý – zkontroluj závorky.');
  return f;
}

/* ---------- kontrola jedné části ---------- */
function setCmp(ans,got,eqf){
  const extra=got.filter(g=>!ans.some(a=>eqf(a,g))), missing=ans.filter(a=>!got.some(g=>eqf(a,g)));
  return {extra,missing,ok:!extra.length&&!missing.length};
}
const ptEq=(a,b)=>a[0].eq(b[0])&&a[1].eq(b[1]);
function checkPart(part,raw){
  const v=part.v||'x';
  switch(part.kind){
    case 'num':{
      const x=parseNum(raw); if(!x) return {ok:false,invalid:true,msg:String(raw||'').trim()===''?'Nic jsi nevyplnil.':'Nerozumím zápisu čísla. Piš např. 3, -2, 3/4 nebo 1,5.'};
      if(x.eq(part.ans)) return {ok:true};
      const m=part.wrong?part.wrong(x):null;
      return {ok:false,msg:m||(!part.ans.isZero()&&x.eq(part.ans.neg())?'Máš opačné znaménko.':'Není to správně.')};
    }
    case 'list':{
      const r=parseList(raw); if(r.error) return {ok:false,invalid:true,msg:r.error};
      const c=setCmp(part.ans,r.vals,(a,b)=>a.eq(b)); if(c.ok) return {ok:true};
      if(part.excluded){const bad=c.extra.filter(e=>part.excluded.some(q=>q.eq(e)));if(bad.length){const e=bad[0].tex();return {ok:false,msg:'Pozor – \\('+v+'='+e+'\\) nemůže být řešením, protože pro \\('+v+'='+e+'\\) je '+(part.exclWhy||'jmenovatel roven nule')+'.'};}}
      if(part.condMode){
        if(c.missing.length) return {ok:false,msg:'Některá podmínka chybí. Projdi všechny jmenovatele – i ty, které vzniknou až rozkladem'+(part.condExtraWhy||'')+'.'};
        return {ok:false,msg:'Pro \\('+v+'='+c.extra[0].tex()+'\\) není žádný jmenovatel nulový – to není podmínka.'};
      }
      if(!part.ans.length) return {ok:false,msg:'Zkontroluj to znovu – takové číslo tu vycházet nemá.'};
      if(r.none) return {ok:false,msg:'Řešení existuje – zkus to znovu.'};
      if(c.missing.length&&!c.extra.length) return {ok:false,msg:'Něco ti chybí – správných hodnot je víc.'};
      if(c.extra.length&&!c.missing.length) return {ok:false,msg:'Máš tam hodnotu navíc: \\('+c.extra[0].tex()+'\\).'};
      return {ok:false,msg:'Není to správně.'};
    }
    case 'row':{
      const r=parseRow(raw); if(r.error) return {ok:false,invalid:true,msg:r.error};
      if(r.vals.length!==part.ans.length) return {ok:false,msg:'Řádek má mít '+part.ans.length+' čísel.'};
      const bad=r.vals.findIndex((x,i)=>!x.eq(part.ans[i]));
      return bad<0?{ok:true}:{ok:false,msg:'Nesedí '+(bad+1)+'. číslo v řádku.'};
    }
    case 'points':{
      const r=parsePoints(raw); if(r.error) return {ok:false,invalid:true,msg:r.error};
      const c=setCmp(part.ans,r.pts,ptEq); if(c.ok) return {ok:true};
      if(!part.ans.length) return {ok:false,msg:'Tady žádný průsečík není (∅).'};
      if(r.none) return {ok:false,msg:'Průsečíky existují – najdi je.'};
      if(part.single&&r.pts.length>1) return {ok:false,msg:'Zadej jen jeden bod.'};
      const swapped=r.pts.some(g=>part.ans.some(a=>a[0].eq(g[1])&&a[1].eq(g[0])&&!a[0].eq(a[1])));
      if(swapped) return {ok:false,msg:'Pořadí souřadnic: nejdřív x, pak y.'};
      const xOk=r.pts.length===part.ans.length&&r.pts.every(g=>part.ans.some(a=>a[0].eq(g[0])));
      if(xOk) return {ok:false,msg:'x-ové souřadnice máš správně, ale y ne. Dosaď je do předpisu.'};
      if(c.missing.length&&!c.extra.length) return {ok:false,msg:'Některý bod chybí.'};
      const m=part.wrong?part.wrong():null;
      return {ok:false,msg:m||'Není to správně.'};
    }
    case 'expr':{
      let f; try{f=parseExpr(raw,v);}catch(e){return {ok:false,invalid:true,msg:e.message};}
      const xs=[0.37,1.73,-2.41,3.19,-0.83,5.31,-4.67,2.57]; let n=0;
      for(const x of xs){const e=part.fn(x);if(!isFinite(e)) continue;const g=f(x);
        if(!isFinite(g)||Math.abs(g-e)>1e-6*Math.max(1,Math.abs(e))){const tip=(String(raw).includes('/')&&!String(raw).includes('('))?' Tip: zlomek piš se závorkami, např. (x-2)/(x+5).':'';return {ok:false,msg:'Výraz se nerovná správnému výsledku.'+tip};}
        n++;}
      if(n<4) return {ok:false,msg:'Výraz se nepodařilo ověřit.'};
      const cnt=(String(raw).match(new RegExp(v,'g'))||[]).length;
      if(cnt>part.maxVar) return {ok:false,msg:'Hodnota sedí, ale výraz ještě není co nejjednodušší – zkrať, co jde.'};
      return {ok:true};
    }
    case 'choice':{
      if(raw==null||raw==='') return {ok:false,invalid:true,msg:'Vyber jednu možnost.'};
      if(raw===part.ans) return {ok:true};
      return {ok:false,msg:(part.wrong&&part.wrong(raw))||'Není to správně.'};
    }
    case 'matrix':{
      const bad=[]; let empty=false;
      part.ans.forEach((row,i)=>row.forEach((a,j)=>{const x=parseNum(raw[i][j]);if(!x){empty=true;bad.push([i,j]);}else if(!x.eq(a)) bad.push([i,j]);}));
      if(!bad.length) return {ok:true};
      return {ok:false,bad,msg:(empty?'Vyplň všechna políčka (chybějící neznámá = 0). ':'')+'Zkontroluj zvýrazněná políčka – pozor na znaménka a pravou stranu.'};
    }
    case 'relnum':{
      const x=parseNum(raw&&raw.val); if(!raw||!raw.rel||!x) return {ok:false,invalid:true,msg:'Vyber znak a doplň číslo.'};
      const vo=x.eq(part.ans.val), ro=raw.rel===part.ans.rel;
      if(vo&&ro) return {ok:true};
      if(vo) return {ok:false,msg:'Hraniční číslo máš správně, ale znak ne. Dělíš-li záporným číslem, znak se otočí; ≤ a ≥ zachovávají rovnost.'};
      if(ro) return {ok:false,msg:'Znak sedí, hraniční číslo ne.'};
      return {ok:false,msg:'Není to správně.'};
    }
    case 'range':{
      const x=parseNum(raw&&raw.val); if(!raw||!raw.dir||!x) return {ok:false,invalid:true,msg:'Vyber tvar intervalu a doplň číslo.'};
      if(x.eq(part.ans.val)&&raw.dir===part.ans.dir) return {ok:true};
      if(x.eq(part.ans.val)) return {ok:false,msg:'Číslo sedí, ale směr ne – podívej se na znaménko a.'};
      return {ok:false,msg:'Krajní hodnota oboru hodnot je y-ová souřadnice vrcholu.'};
    }
    case 'interval':{
      const r=parseIntervals(raw); if(r.error) return {ok:false,invalid:true,msg:r.error};
      return segsEqual(r.segs,part.ans)?{ok:true}:{ok:false,msg:'Intervaly nesedí – zkontroluj krajní body a závorky.'};
    }
    case 'signs': return checkSigns(part,raw||[]);
    case 'pick': return checkPick(part,raw||{I:[],P:[]});
  }
  return {ok:false,msg:'?'};
}
/* text správné odpovědi (pro výsledky písemky) */
function answerTex(part){
  switch(part.kind){
    case 'num': return '\\('+part.ans.tex()+'\\)';
    case 'list': return part.ans.length?'\\('+part.ans.map(a=>a.tex()).join(';\\ ')+'\\)':'∅';
    case 'points': return part.ans.length?'\\('+part.ans.map(p=>ptTex(p[0],p[1])).join(';\\ ')+'\\)':'∅';
    case 'choice': return part.options.find(o=>o.v===part.ans).l;
    case 'matrix': return '\\('+matTex(part.ans,{aug:part.aug})+'\\)';
    case 'relnum': return '\\(x'+REL_TEX[part.ans.rel]+part.ans.val.tex()+'\\)';
    case 'range': return '\\('+(part.ans.dir==='up'?'\\langle '+part.ans.val.tex()+';\\infty)':'(-\\infty;'+part.ans.val.tex()+'\\rangle')+'\\)';
    case 'interval': return '\\('+segsTex(part.ans)+'\\)';
    case 'expr': return '(viz řešení)';
    default: return '';
  }
}

/* ---------- teoretické otázky jako „problém“ ---------- */
function buildTheoryQ(q,idx){
  let parts;
  if(q.type==='mc') parts=[{id:'q',kind:'choice',label:'Vyber správnou odpověď:',options:q.options.map((l,i)=>({v:String(i),l})),ans:String(q.ans)}];
  else if(q.type==='tf') parts=[{id:'q',kind:'choice',label:'Pravda, nebo nepravda?',options:[{v:'t',l:'Pravda'},{v:'f',l:'Nepravda'}],ans:q.ans?'t':'f'}];
  else parts=[{id:'q',kind:'self',label:'Odpověz vlastními slovy (stačí v hlavě nebo na papír), pak se porovnej:',model:q.model}];
  return {topic:'teorie',diff:1,title:'Teoretická otázka',statement:'<p class="tq">'+q.q+'</p>',parts,hints:[],steps:[{t:'Vysvětlení',h:'<p>'+(q.expl||q.model)+'</p>'}],summary:q.type==='open'?q.model:answerTex(parts[0]),printTask:'',data:{idx}};
}

/* ---------- rychlý dril ---------- */
const DRILL_TYPES=[
  {id:'det2',name:'Determinant 2×2',topic:'cramer'},{id:'cond',name:'Podmínka výrazu',topic:'vyrazy'},
  {id:'gstep',name:'Krok Gaussovy eliminace',topic:'gauss'},{id:'nulb',name:'Nulové body',topic:'nerovnice'},
  {id:'znam',name:'Znaménko na intervalu',topic:'nerovnice'},{id:'smer',name:'Směrnice',topic:'linear'},
  {id:'vrch',name:'Vrchol paraboly',topic:'kvadr'},{id:'disk',name:'Diskriminant',topic:'kvadr'},{id:'prus',name:'Průsečík s osou',topic:'kvadr'}
];
function genDrill(rng,type){
  const id=type||rng.pick(DRILL_TYPES).id;
  switch(id){
    case 'det2':{const [a,b,c,d]=[0,0,0,0].map(()=>rng.int(-6,6));const D=fr(a*d-b*c);
      return {id,q:'Vypočítej determinant \\(\\begin{vmatrix} '+a+' & '+b+' \\\\ '+c+' & '+d+' \\end{vmatrix}\\)',part:{kind:'num',ans:D},explain:'\\(ad-bc='+pT(fr(a))+'\\cdot'+pT(fr(d))+'-'+pT(fr(b))+'\\cdot'+pT(fr(c))+'='+D.tex()+'\\)'};}
    case 'cond':{const u=rng.int(-6,6);let w=rng.int(1,6);const kind=rng.int(0,2);let tex,ans;
      if(kind===0){tex='\\frac{3}{x^2-'+(w*w)+'}';ans=[fr(-w),fr(w)];}
      else if(kind===1){tex='\\frac{x+1}{x^2'+(u>=0?'-':'+')+Math.abs(u)+'x}';ans=u===0?[fr(0)]:[fr(0),fr(u)].sort((p,q)=>p.cmp(q));if(u===0) tex='\\frac{x+1}{x^2}';}
      else{const p=rng.int(-5,5);tex='\\frac{2}{x'+(p>=0?'-':'+')+Math.abs(p)+'}+\\frac{1}{x}';ans=p===0?[fr(0)]:[fr(0),fr(p)].sort((q,r)=>q.cmp(r));if(p===0) tex='\\frac{2}{x}+\\frac{1}{x}';}
      return {id,q:'Pro která x nemá výraz \\('+tex+'\\) smysl? (odděl středníkem)',part:{kind:'list',ans,v:'x'},explain:'Jmenovatel ≠ 0: \\(x\\neq '+ans.map(a=>a.tex()).join(',\\ x\\neq ')+'\\)'};}
    case 'gstep':{const r1=[1,rng.int(-3,3),rng.int(-3,3),rng.int(-6,6)];const k=rng.nz(-3,3);const r2=[k,rng.int(-4,4),rng.int(-4,4),rng.int(-8,8)];
      const res=r2.map((v,i)=>fr(v-k*r1[i]));
      return {id,q:'\\(R_1=('+r1.join(';\\ ')+')\\), \\(R_2=('+r2.join(';\\ ')+')\\). Proveď \\(R_2\\to R_2'+(k>0?'-':'+')+(Math.abs(k)===1?'':Math.abs(k))+'R_1\\) a zapiš nový \\(R_2\\) (4 čísla, odděl středníkem).',part:{kind:'row',ans:res},explain:'Nový \\(R_2=('+res.map(x=>x.tex()).join(';\\ ')+')\\) – první číslo musí vyjít 0.'};}
    case 'nulb':{const a=rng.int(-5,5),b=rng.int(-5,5),c=rng.int(-5,5);if(new Set([a,b,c]).size<3) return genDrill(rng,id);
      const ans=[fr(a),fr(b),fr(c)].sort((p,q)=>p.cmp(q));
      return {id,q:'Urči všechny nulové body (čitatele i jmenovatele) výrazu \\(\\frac{'+factorTex(P.mul(xp(a),xp(b)))+'}{'+factorTex(xp(c))+'}\\).',part:{kind:'list',ans,v:'x'},explain:'Čitatel: \\('+a+',\\ '+b+'\\), jmenovatel: \\('+c+'\\).'};}
    case 'znam':{const a=rng.int(-5,5),b=rng.int(-5,5);if(a===b) return genDrill(rng,id);
      const lo=Math.min(a,b),hi=Math.max(a,b); const which=rng.int(0,2);
      const t=which===0?lo-1:which===1?(lo+hi)/2:hi+1; const tF=which===1?fr(lo+hi,2):fr(t);
      const s=Math.sign((t-a)/(t-b)); const lab=which===0?'(-\\infty;\\ '+lo+')':which===1?'('+lo+';\\ '+hi+')':'('+hi+';\\ \\infty)';
      return {id,q:'Jaké znaménko má \\(\\frac{'+P.tex(xp(a))+'}{'+P.tex(xp(b))+'}\\) na intervalu \\('+lab+'\\)?',part:{kind:'choice',options:[{v:'+',l:'+'},{v:'-',l:'−'}],ans:s>0?'+':'-'},explain:'Dosaď např. \\(x='+tF.tex()+'\\): znaménko '+(s>0?'+':'−')+'.'};}
    case 'smer':{const x1=rng.int(-5,5),x2=rng.int(-5,5);if(x1===x2) return genDrill(rng,id);const y1=rng.int(-6,6),y2=rng.int(-6,6);const a=fr(y2-y1,x2-x1);
      return {id,q:'Urči směrnici přímky body \\(['+x1+';'+y1+']\\) a \\(['+x2+';'+y2+']\\).',part:{kind:'num',ans:a},explain:'\\(a=\\frac{'+y2+'-'+pT(fr(y1))+'}{'+x2+'-'+pT(fr(x1))+'}='+a.tex()+'\\)'};}
    case 'vrch':{const m=rng.int(-4,4),n=rng.int(-5,5);const p=[fr(m*m+n),fr(-2*m),fr(1)];
      return {id,q:'Urči vrchol paraboly \\(y='+P.tex(p)+'\\) (zapiš jako [x;y]).',part:{kind:'points',single:true,ans:[[fr(m),fr(n)]]},explain:'\\(x_V=-\\frac{b}{2a}='+m+'\\), \\(y_V='+n+'\\), \\(V=['+m+';'+n+']\\)'};}
    case 'disk':{const a=rng.nz(-3,3),b=rng.int(-6,6),c=rng.int(-6,6);const D=fr(b*b-4*a*c);
      return {id,q:'Vypočítej diskriminant \\('+P.tex([fr(c),fr(b),fr(a)])+'=0\\).',part:{kind:'num',ans:D},explain:'\\(D='+pT(fr(b))+'^2-4\\cdot'+pT(fr(a))+'\\cdot'+pT(fr(c))+'='+D.tex()+'\\)'};}
    case 'prus':{if(rng.chance(0.5)){const a=rng.nz(-3,3),b=rng.int(-6,6),c=rng.int(-9,9);
        return {id,q:'Průsečík grafu \\(y='+P.tex([fr(c),fr(b),fr(a)])+'\\) s osou y:',part:{kind:'points',single:true,ans:[[fr(0),fr(c)]]},explain:'Dosadíme x = 0: \\([0;'+c+']\\)'};}
      const a=rng.nz(-4,4),b=rng.int(-8,8);const x0=fr(-b,a);
      return {id,q:'Průsečík přímky \\(y='+linTexAB(fr(a),fr(b))+'\\) s osou x:',part:{kind:'points',single:true,ans:[[x0,fr(0)]]},explain:'y = 0: \\(x='+x0.tex()+'\\), bod \\(['+x0.tex()+';0]\\)'};}
  }
}

  const L=[['a','b','c'],['d','e','f'],['g','h','i'],['a','b','c'],['d','e','f']];
  const X=c=>34+c*46, Y=r=>26+r*34;
  let s='<svg class="sarrus" viewBox="0 0 160 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sarrusovo pravidlo – první dva řádky opsané pod matici">';
  for(let k=0;k<3;k++) s+='<line class="dg plus" x1="'+(X(0)-12)+'" y1="'+(Y(k)-14)+'" x2="'+(X(2)+12)+'" y2="'+(Y(k+2)+8)+'"/>';
  for(let k=0;k<3;k++) s+='<line class="dg minus" x1="'+(X(2)+12)+'" y1="'+(Y(k)-14)+'" x2="'+(X(0)-12)+'" y2="'+(Y(k+2)+8)+'"/>';
  s+='<line class="sep" x1="10" y1="'+(Y(3)-20)+'" x2="150" y2="'+(Y(3)-20)+'"/>';
  L.forEach((row,r)=>row.forEach((t,col)=>{s+='<text class="'+(r>2?'rep':'')+'" x="'+X(col)+'" y="'+(Y(r)+6)+'" text-anchor="middle">'+t+'</text>';}));

<h4>Rozklady, které musíš poznat</h4>
<ul class="ops"><li>Vytýkání: \(x^2-3x=x(x-3)\)</li><li>Rozdíl čtverců: \(a^2-b^2=(a-b)(a+b)\), např. \(x^2-16=(x-4)(x+4)\)</li><li>Trojčlen: \(x^2+x-6=(x+3)(x-2)\) – čísla se součinem −6 a součtem 1</li></ul>
<div class="warnbox"><b>Krátit se mohou činitelé, ne členy součtu.</b>
\[\frac{(x-2)(x+3)}{(x-2)(x+5)}=\frac{x+3}{x+5}\ \text{✓}\qquad\qquad \frac{x+2}{x+5}\neq\frac{2}{5}\ \text{✗ (x je sčítanec)}\]</div>
<h4>Podmínky</h4>
<p>Čti je z <b>rozloženého</b> jmenovatele a piš je <b>před</b> krácením – po zkrácení zmizí, ale platí dál. Když dělíš zlomkem, nesmí být nula ani jeho čitatel.</p>
<h4>Sčítání zlomků</h4>
<p>Společný jmenovatel = součin všech různých činitelů. Každý zlomek rozšiř, sečti čitatele, roznásob, vytkni, zkrať.</p>`,

linear:String.raw`
\[f:\ y=ax+b\qquad a\ \text{– směrnice},\quad b\ \text{– absolutní člen (průsečík s osou y)}\]
<ul class="ops"><li>\(a>0\) rostoucí, \(a<0\) klesající, \(a=0\) konstantní.</li><li>Průsečík s osou y: \([0;\ b]\). S osou x: polož \(y=0\), vyjde \(x=-\frac{b}{a}\).</li></ul>
<h4>Rovnice ze dvou bodů</h4>
\[a=\frac{y_2-y_1}{x_2-x_1}\qquad\text{pak dosaď jeden bod a dopočítej }b\]
<p>Body \(K[3;2],\ L[-1;4]\): \(a=\frac{4-2}{-1-3}=-\frac12\), \(2=-\frac12\cdot3+b\Rightarrow b=\frac72\).</p>
<h4>Nerovnice f(x) &gt; k</h4>
<p>Řeš jako lineární nerovnici. <b>Dělíš-li záporným číslem, otoč znak.</b></p>
<h4>Slovní úlohy</h4>
<p>Dvě dvojice hodnot jsou dva body grafu. Např. „8 °C odpovídá 46,4 °F, 24 °C odpovídá 75,2 °F“ jsou body \([8;\ 46{,}4]\) a \([24;\ 75{,}2]\). Pak počítáš úplně stejně: \(a\) = změna za jednotku, \(b\) = počáteční hodnota.</p>`,

kvadr:String.raw`
<ul class="ops"><li>Obecný tvar: \(f(x)=ax^2+bx+c,\ a\neq0\)</li><li>Vrcholový tvar: \(f(x)=a(x-m)^2+n\) → vrchol \(V=[m;\ n]\)</li><li>Součinový tvar: \(f(x)=a(x-x_1)(x-x_2)\) – jen když existují kořeny</li></ul>
<h4>Co z toho vyčteš</h4>
<ul class="ops"><li>\(a>0\) parabola nahoru (minimum), \(a<0\) dolů (maximum).</li><li>Vrchol: \(x_V=-\frac{b}{2a},\ y_V=f(x_V)\). Osa souměrnosti: \(x=x_V\).</li><li>\(D=b^2-4ac\): \(D>0\) dva průsečíky s osou x, \(D=0\) jeden (dotyk), \(D<0\) žádný.</li><li>Průsečík s osou y: \([0;\ c]\).</li><li>\(D(f)=\mathbb{R}\); \(H(f)=\langle y_V;\infty)\) pro \(a>0\), \((-\infty;\ y_V\rangle\) pro \(a<0\).</li></ul>
<h4>Doplnění na čtverec</h4>
\[x^2-2x+3=(x^2-2x+1)-1+3=(x-1)^2+2\;\Rightarrow\;V=[1;\ 2],\ D=-8<0,\ H(f)=\langle2;\infty)\]
<h4>Průsečíky dvou grafů</h4>
<p>Polož \(f(x)=g(x)\), vyřeš rovnici a ke každému x dopočítej y. Výsledkem jsou <b>celé body</b> \([x;\ y]\).</p>`

const $=(s,el=document)=>el.querySelector(s);

/* ---------- MathJax ---------- */
const MJ={ready:false,queue:[],p:Promise.resolve()};
function typeset(el){
  el=el||document.body;
  if(!MJ.ready||!window.MathJax||!MathJax.typesetPromise){MJ.queue.push(el);return Promise.resolve();}
  MJ.p=MJ.p.then(()=>document.body.contains(el)?MathJax.typesetPromise([el]):null).catch(e=>console.warn('MathJax',e));
  return MJ.p;
}
function clearMath(el){if(MJ.ready&&window.MathJax&&MathJax.typesetClear){try{MathJax.typesetClear([el]);}catch(e){}}}
window.__mjReady=function(){MJ.ready=true;const q=MJ.queue.splice(0);q.forEach(el=>typeset(el));};

const LS_KEY='matikaTrenink_radovan_v1';
const Store={
  d:null,mem:false,
  fresh(){return {solved:0,correct:0,wrong:0,streak:0,best:0,topics:{},mistakes:{},daily:null,dailyHist:[],drill:null,exams:[],diff:{}};},
  load(){let d=null;try{d=JSON.parse(localStorage.getItem(LS_KEY));}catch(e){this.mem=true;}this.d=Object.assign(this.fresh(),d||{});},
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.d));}catch(e){this.mem=true;}},
  topic(id){return this.d.topics[id]||(this.d.topics[id]={n:0,scores:[]});},
  record(topic,score,correct){
    const t=this.topic(topic); t.n++; t.scores.push(Math.round(score*100)); if(t.scores.length>10) t.scores.shift();
    this.d.solved++;
    if(correct){this.d.correct++;this.d.streak++;this.d.best=Math.max(this.d.best,this.d.streak);}
    else{this.d.wrong++;this.d.streak=0;}
    this.save();
  },
  mistake(topic){this.d.mistakes[topic]=(this.d.mistakes[topic]||0)+1;this.save();},
  progress(topic){const t=this.d.topics[topic];if(!t||!t.scores.length) return null;return Math.round(t.scores.reduce((a,b)=>a+b,0)/t.scores.length);},
  reset(){this.d=this.fresh();try{localStorage.removeItem(LS_KEY);}catch(e){}}
};
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtTime(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

      get=()=>arr.slice(); lock=()=>$$('.sgn',el).forEach(b=>{b.disabled=true;}); focus=()=>$('.sgn',el).focus(); break;}
    case 'pick':{
      const I=p.I; let h='<div class="pl">'+p.label+'</div><div class="pickline">';
      for(let i=0;i<=I.pts.length;i++){
        h+='<label class="pk iv"><input type="checkbox" data-t="I" data-i="'+i+'"><span>\\('+intervalLabel(I.pts,i)+'\\)</span></label>';
        if(i<I.pts.length) h+='<label class="pk pt"><input type="checkbox" data-t="P" data-i="'+i+'"><span>bod \\('+I.pts[i].tex()+'\\)</span></label>';
      }
      el.innerHTML=h+'</div><div class="pickres"></div>'+fbH;
      get=()=>{const r={I:[],P:[]};$$('input',el).forEach(c=>{r[c.dataset.t][+c.dataset.i]=c.checked;});return r;};
      const upd=()=>{const g=get();const segs=buildSegs(I.pts,I.inclI.map((_,i)=>!!g.I[i]),I.pts.map((_,i)=>!!g.P[i]));const pr=$('.pickres',el);clearMath(pr);pr.innerHTML='Tvůj výsledek: \\(K='+segsTex(segs)+'\\)';typeset(pr);};
      $$('input',el).forEach(c=>c.addEventListener('change',upd));
      lock=()=>$$('input',el).forEach(i=>{i.disabled=true;}); focus=()=>$('input',el).focus(); break;}
    case 'self':{
      el.innerHTML='<div class="pl">'+p.label+'</div><textarea rows="3" class="in" aria-label="Tvoje odpověď"></textarea><div class="selfrow"><button type="button" class="btn" data-s="show">Porovnat se vzorovou odpovědí</button></div>'+
        '<div class="model" hidden><b>Vzorová odpověď:</b> '+p.model+'<div class="selfrow"><button type="button" class="btn ok" data-s="y">Věděl/a jsem ✓</button><button type="button" class="btn" data-s="n">Nevěděl/a jsem</button></div></div>';
      $('[data-s=show]',el).onclick=()=>{$('.model',el).hidden=false;typeset($('.model',el));};
      $('[data-s=y]',el).onclick=()=>p._self&&p._self(true);
      $('[data-s=n]',el).onclick=()=>p._self&&p._self(false);
      break;}
  }
  const fb=$('.fb',el);
  p._get=get; p._lock=lock; p._focus=focus; p._el=el;
  p._mark=(cls,msg,r)=>{
    el.classList.remove('ok','bad','inv'); el.classList.add(cls);
    if(fb){clearMath(fb);fb.innerHTML=msg;typeset(fb);}
    if(p.kind==='matrix'){$$('td',el).forEach(td=>td.classList.remove('wrong'));if(r&&r.bad) r.bad.forEach(([i,j])=>p._cell(i,j).closest('td').classList.add('wrong'));}
    if(p.kind==='signs'){$$('td',el).forEach(td=>td.classList.remove('wrong'));if(r&&r.wrong) r.wrong.forEach(i=>$('.sgn[data-i="'+i+'"]',el).closest('td').classList.add('wrong'));}
  };
  return el;
}

const DIFF_NAME={1:'Lehké',2:'Střední',3:'Těžké'};
function mountProblem(host,prob,opt={}){
  const exam=opt.mode==='exam';
  const parts=exam?(prob.examParts||prob.parts):prob.parts;
  const isTheory=prob.topic==='teorie';
  const st={hints:[false,false],steps:0,sol:false,failed:false,mistake:false,done:false,ok:{},stage:exam?99:0};
  const maxStage=Math.max(0,...parts.map(p=>p.stage||0));
  const hasCheck=parts.some(p=>p.kind!=='self');
  clearMath(host);
  host.innerHTML='<article class="prob'+(prob.diff===3&&!isTheory?' is-hard':'')+'">'+
    '<header class="ph"><span class="chip">'+(TOPICS[prob.topic]?TOPICS[prob.topic].short:'')+'</span>'+(isTheory?'':'<span class="chip d'+prob.diff+'">'+DIFF_NAME[prob.diff]+'</span>')+'<h3>'+prob.title+'</h3></header>'+
    '<div class="stmt">'+prob.statement+'</div><div class="parts"></div>'+
    (exam?'':'<div class="acts">'+
      (hasCheck?'<button type="button" class="btn primary" data-a="check">Zkontrolovat</button>':'')+
      (prob.checkOnly?'<button type="button" class="btn" data-a="checkOnly">Zkontrolovat pouze D</button>':'')+
      (prob.hints&&prob.hints.length?'<button type="button" class="btn ghost" data-a="h0">Nápověda 1</button><button type="button" class="btn ghost" data-a="h1">Nápověda 2</button>':'')+
      (!isTheory&&prob.steps.length?'<button type="button" class="btn ghost" data-a="step">Ukázat další krok</button><button type="button" class="btn ghost warn" data-a="sol">Ukázat řešení</button>':'')+
      '</div>'+(isTheory?'':'<p class="cap"></p>')+'<div class="hintbox"></div><ol class="steps stepbox"></ol><div class="res" role="status" aria-live="polite"></div>'+
      (opt.onNext?'<div class="nextwrap"><button type="button" class="btn next" data-a="next">'+(opt.nextLabel||'DALŠÍ PODOBNÝ PŘÍKLAD')+'</button></div>':''))+
  '</article>';
  const art=$('.prob',host), partsEl=$('.parts',art);
  parts.forEach(p=>partsEl.appendChild(renderPart(p,()=>doCheck())));
  const lockMsg=document.createElement('p'); lockMsg.className='lockmsg'; lockMsg.textContent='🔒 Další část se odemkne, až správně vyřešíš předchozí krok (nebo si ukážeš další krok řešení).';
  if(!exam&&maxStage>0) partsEl.appendChild(lockMsg);
  function showStages(){parts.forEach(p=>{p._el.hidden=(p.stage||0)>st.stage;});lockMsg.hidden=st.stage>=maxStage;}
  showStages();
  const capEl=$('.cap',art), resEl=$('.res',art), stepBox=$('.stepbox',art);
  const aids=()=>st.hints.filter(Boolean).length+st.steps;
  function cap(){if(st.sol) return 0;let c=aids()?Math.max(0.2,1-0.2*aids()):1;if(st.failed) c=Math.min(c,0.7);return c;}
  function updCap(){if(!capEl||st.done) return;capEl.textContent='Za tuto úlohu teď můžeš získat max. '+Math.round(cap()*100)+' %'+(aids()?' (použité nápovědy a kroky: '+aids()+')':'')+(st.failed?', po opravě chyby max. 70 %':'')+'.';}
  function setRes(cls,html){if(!resEl) return;clearMath(resEl);resEl.className='res '+cls;resEl.innerHTML=html;typeset(resEl);}
  function revealStep(){
    if(st.steps>=prob.steps.length) return;
    const s=prob.steps[st.steps]; st.steps++;
    const li=document.createElement('li'); li.innerHTML='<h4>'+s.t+'</h4>'+s.h; stepBox.appendChild(li); typeset(li);
    if(prob.stageUnlock) for(const k in prob.stageUnlock) if(st.steps>prob.stageUnlock[k]&&st.stage<+k){st.stage=+k;showStages();}
  }
  function finish(success,how){
    if(st.done) return; st.done=true;
    const score=success?cap():0, correct=success&&!st.failed&&!st.sol;
    Store.record(prob.topic,score,correct);
    if(capEl) capEl.textContent='';
    if(success) setRes('ok','<b>'+(correct?'Výborně, všechno správně!':'Hotovo.')+'</b> Získáváš '+Math.round(score*100)+' %.'+(st.failed?' Napoprvé to nevyšlo, ale chybu jsi opravil/a.':''));
    else if(how==='self') setRes('bad','Nevadí – přečti si vzorovou odpověď a vrať se k otázce později.');
    else setRes('bad','Řešení zobrazeno – za tuto úlohu 0 bodů. Projdi si postup a zkus další podobný příklad.<div class="sum"><b>Výsledek:</b> '+prob.summary+'</div>');
    if(isTheory) while(st.steps<prob.steps.length) revealStep();
    parts.forEach(p=>p._lock&&p._lock());
    $$('.acts [data-a=check], .acts [data-a=checkOnly]',art).forEach(b=>{b.disabled=true;});
    const nb=$('[data-a=next]',art); if(nb){nb.classList.add('pulse');}
    opt.onFinish&&opt.onFinish({score,correct});
  }
  function doCheck(onlyId){
    if(st.done||exam) return;
    const vis=parts.filter(p=>p.kind!=='self'&&(p.stage||0)<=st.stage&&(!onlyId||p.id===onlyId));
    let wrong=false, allOk=true;
    for(const p of vis){
      if(st.ok[p.id]) continue;
      const r=checkPart(p,p._get());
      if(r.ok){st.ok[p.id]=true;p._mark('ok','Správně ✓');p._lock();}
      else{allOk=false;if(!r.invalid) wrong=true;p._mark(r.invalid?'inv':'bad',r.msg,r);}
    }
    if(wrong){st.failed=true;if(!st.mistake){st.mistake=true;Store.mistake(prob.topic);}}
    updCap();
    if(onlyId){setRes(allOk?'info':'bad-soft',allOk?'D je správně – pokračuj determinanty \\(D_x, D_y, D_z\\).':'D zatím nesedí – podívej se na poznámku u něj.');return;}
    if(!allOk){setRes('bad-soft',wrong?'Něco nesedí – přečti si poznámku u označené části a oprav to.':'Doplň chybějící části.');return;}
    if(st.stage<maxStage){st.stage++;showStages();setRes('info','Správně – pokračuj dalším krokem.');const nx=parts.find(p=>(p.stage||0)===st.stage);nx&&nx._focus();return;}
    finish(true);
  }
  parts.forEach(p=>{if(p.kind==='self') p._self=ok=>{if(st.done) return;if(!ok) Store.mistake('teorie');finish(ok,ok?null:'self');};});
  if(!exam){
    updCap();
    $('.acts',art).addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return; const a=b.dataset.a;
      if(a==='check') doCheck();
      else if(a==='checkOnly') doCheck(prob.checkOnly);
      else if(a==='h0'||a==='h1'){
        const i=+a[1];
        if(!st.done) st.hints[i]=true;
        const d=document.createElement('div'); d.className='hint'; d.innerHTML='<b>Nápověda '+(i+1)+':</b> '+prob.hints[i];
        $('.hintbox',art).appendChild(d); typeset(d); b.disabled=true; updCap();
      }
      else if(a==='step'){
        if(st.steps>=prob.steps.length-1&&!st.done){st.sol=true;revealStep();finish(false);}
        else{revealStep();updCap();}
        if(st.steps>=prob.steps.length){b.disabled=true;const sb=$('[data-a=sol]',art);if(sb) sb.disabled=true;}
      }
      else if(a==='sol'){
        if(!st.done) st.sol=true;
        st.stage=maxStage; showStages();
        while(st.steps<prob.steps.length) revealStep();
        if(!st.done) finish(false);
        b.disabled=true; const sb=$('[data-a=step]',art); if(sb) sb.disabled=true;
      }
    });
    const nb=$('[data-a=next]',art); if(nb) nb.onclick=()=>opt.onNext();
  }
  return {
    art,
    evaluate(){
      let ok=0; const wrong=[];
      for(const p of parts){
        const r=checkPart(p,p._get());
        if(r.ok){ok++;p._mark('ok','Správně ✓');}
        else{p._mark('bad',(r.invalid?'Nevyplněno nebo nečitelné. ':'')+'Správně: '+answerTex(p),r);wrong.push({label:p.label,ans:answerTex(p)});}
        p._lock();
      }
      return {ok,total:parts.length,wrong};
    }
  };
}

  return '<div class="stmt">'+prob.statement+'</div><ol class="steps">'+prob.steps.map(s=>'<li><h4>'+s.t+'</h4>'+s.h+'</li>').join('')+'</ol><p class="sum"><b>Výsledek:</b> '+prob.summary+'</p>';
}

function findError(host){
  const order=shuffle(FIND_ERR.map((_,i)=>i)); let k=0;
  function show(){
    const it=FIND_ERR[order[k%order.length]]; let tried=false, done=false;
    clearMath(host);
    host.innerHTML='<article class="prob"><header class="ph"><span class="chip">Najdi chybu</span><span class="chip">'+(k%order.length+1)+' / '+order.length+'</span><h3>'+it.title+'</h3></header>'+

/* ---------- relace (dnešní trénink, slabiny) ---------- */
function runSession(app,title,queue,onDone){
  const res=[]; let i=0;
  function show(){
    if(i>=queue.length){onDone(res);return;}
    const q=queue[i]; let prob=null;
    for(let t=0;t<5&&!prob;t++){try{prob=genProblem(q.topic,q.diff,new Rng());}catch(e){}}
    if(!prob){i++;show();return;}
    clearMath(app);
    app.innerHTML='<nav class="crumbs"><a href="#">← Přehled</a></nav><header class="sess-head"><h1>'+title+'</h1><div class="sess-prog"><span>Úloha '+(i+1)+' / '+queue.length+'</span><span class="bt"><span class="bf" style="width:'+(i/queue.length*100)+'%"></span></span></div></header><div id="sh"></div>';
    let fin=null; window.__lastProb=prob;
    mountProblem($('#sh',app),prob,{mode:'practice',nextLabel:i===queue.length-1?'DOKONČIT':'DALŠÍ ÚLOHA',onFinish:r=>{fin=r;},
      onNext:()=>{res.push({topic:prob.topic,title:prob.title,score:fin?fin.score:0,correct:fin?fin.correct:false,skipped:!fin});i++;show();window.scrollTo(0,0);}});
    typeset(app);
  }
  show();
}
function sessionSummary(res){
  const pct=res.length?Math.round(res.reduce((a,r)=>a+r.score,0)/res.length*100):0;
  return {pct,html:'<table class="tbl"><thead><tr><th>Úloha</th><th>Téma</th><th>Body</th></tr></thead><tbody>'+res.map((r,i)=>'<tr><td>'+(i+1)+'. '+r.title+'</td><td>'+TOPICS[r.topic].short+'</td><td>'+(r.skipped?'přeskočeno':Math.round(r.score*100)+' %')+'</td></tr>').join('')+'</tbody></table>'};
}

function pageDrill(app){
  const last=Store.d.drill;

  $('[data-a=go]',app).onclick=()=>run();
  function run(){
    const end=Date.now()+600000, stats={n:0,ok:0,by:{}}; let cur=null, answered=false;
    app.innerHTML='<div class="drill"><div class="drill-top"><span class="timer" id="dt">10:00</span><span class="sc" id="dsc">0 / 0</span><button type="button" class="btn small" data-a="stop">Ukončit</button></div><div class="drill-card" id="dq"></div></div>';

    }
    function answer(raw){
      if(answered){next();return;}
      const dq=$('#dq'), fb=$('.fb',dq), r=checkPart(cur.part,raw);

      answered=true; stats.n++; const b=stats.by[cur.id]||(stats.by[cur.id]={n:0,ok:0}); b.n++;
      if(r.ok){stats.ok++;b.ok++;}else{Store.mistake(DRILL_TYPES.find(t=>t.id===cur.id).topic);}
      fb.className='fb '+(r.ok?'ok':'bad'); fb.innerHTML=(r.ok?'✓ Správně. ':'✗ '+(r.msg||'Špatně.')+' ')+cur.explain+'<div style="margin-top:8px"><button type="button" class="btn" data-a="nx">Další (Enter)</button></div>';
      typeset(fb); $('[data-a=nx]',fb).onclick=()=>next(); $('#dsc').textContent=stats.ok+' / '+stats.n;

    }

        '<p style="margin-top:14px"><button type="button" class="btn primary" data-a="again">Další dril</button> <a class="btn" href="#">Přehled</a></p></div>';
      $('[data-a=again]',app).onclick=()=>run();
    }
  }
}
