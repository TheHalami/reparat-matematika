<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematika – trénink na písemku | Radovan</title>
<meta name="description" content="Procvičování: determinanty, Gaussova eliminace, lomené rovnice a nerovnice, výrazy, lineární a kvadratické funkce.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script>
window.MathJax={
  tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},
  svg:{fontCache:'global'},
  options:{enableMenu:false},
  startup:{pageReady(){return MathJax.startup.defaultPageReady().then(()=>{window.__mjReady&&window.__mjReady();});}}
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{
  --paper:#F2F5F1; --grid:#E1E8E0; --card:#FCFDFB; --ink:#17233A; --ink2:#4B5970; --line:#C8D2CA;
  --teorie:#2456A6; --teorie-bg:#E8EFFA;
  --priklad:#6A45B8; --priklad-bg:#F0EBFB;
  --ok:#1D7748; --ok-bg:#E3F3E9;
  --bad:#B3261E; --bad-bg:#FBE8E6;
  --warn:#9A5800; --warn-bg:#FFF1D4;
  --hard:#8C1D5A; --hard-bg:#F8E4EE;
  --pencil:#F2C230;
  --r:8px;
  --ff:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fh:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--ff);font-size:17px;line-height:1.55;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.15;margin:0 0 .5em}
a{color:var(--teorie)}
p{margin:.4em 0 .8em}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* ---------- horní lišta ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:52px}
.brand{font-family:var(--fh);font-weight:700;font-size:1.05rem;color:#fff;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border-left:3px solid var(--pencil);border-bottom:3px solid var(--pencil)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#C9D3E6;text-decoration:none;padding:8px 11px;border-radius:6px;font-weight:500;font-size:.93rem;white-space:nowrap}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a.on{color:var(--ink);background:var(--pencil)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
.crumbs{margin-bottom:10px}.crumbs a{text-decoration:none;font-weight:600;color:var(--ink2)}

/* ---------- tlačítka ---------- */
.btn{font:inherit;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:7px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:#fff;box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#22314f}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--ink2);color:var(--ink)}
.btn.warn{border-color:#E6C48A;color:var(--warn)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.small{padding:6px 11px;font-size:.85rem}
.btn.big{padding:13px 22px;font-size:1.05rem}
.btn.next{width:100%;padding:16px;font-family:var(--fh);font-size:1.2rem;font-weight:700;letter-spacing:.02em;background:var(--pencil);border-color:var(--ink);color:var(--ink);margin-top:10px}
.btn.next:hover{box-shadow:0 3px 0 var(--ink)}
.btn.next.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}}
@media (prefers-reduced-motion:reduce){.btn.next.pulse{animation:none}}

/* ---------- úvod ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;margin:6px 0 26px}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.6rem);font-weight:700;letter-spacing:-.01em;margin-bottom:.25em}
.lead{font-size:1.15rem;color:var(--ink2);margin:0 0 18px}
.reco{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 18px;max-width:520px}
.reco h2{font-size:1.15rem;margin-bottom:6px}
.reco ol{margin:0;padding-left:1.4em}.reco li{padding:2px 0;font-weight:600}
.reco li a{color:var(--ink);text-decoration-color:var(--pencil);text-decoration-thickness:3px;text-underline-offset:3px}
.why{font-size:.9rem;color:var(--ink2);margin:6px 0 0}
.cta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero-svg{width:100%;max-width:400px;display:block;margin:0 auto}
.hero-svg text{font-family:var(--fh);font-size:30px;font-weight:600;fill:var(--ink)}
.hero-svg text.z{fill:#9AA8A0;font-weight:500}
.hero-svg .pv{fill:var(--pencil);opacity:.85}
.hero-svg .brk,.hero-svg .bar{fill:none;stroke:var(--ink);stroke-width:3}
.hero-svg .stair{fill:none;stroke:var(--hard);stroke-width:3.5;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero-svg .stair{animation:none;stroke-dashoffset:0}}

/* ---------- dashboard ---------- */
.dash{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px 20px;margin-bottom:28px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dash-head h2{font-size:1.4rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.stat{padding:12px 10px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--fh);font-size:1.9rem;font-weight:700;line-height:1}
.stat .v.ok{color:var(--ok)}.stat .v.bad{color:var(--bad)}
.stat .k{font-size:.85rem;color:var(--ink2);margin-top:4px}
.stat .s{font-size:.78rem;color:var(--ink2)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 34px;margin-top:16px}
.bar{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:3px 0}
.bar:hover .bl{text-decoration:underline}
.bl{font-weight:500;font-size:.93rem}
.bt{height:10px;background:#E3E9E3;border-radius:5px;overflow:hidden;display:block}
.bf{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .4s}
.bf.lo{background:var(--bad)}.bf.mid{background:var(--warn)}.bf.hi{background:var(--ok)}
.bv{font-family:var(--fh);font-weight:600;text-align:right;font-size:.95rem}
.fine{font-size:.82rem;color:var(--ink2);margin:10px 0 0}

/* ---------- dlaždice ---------- */
.tiles-sec h2{font-size:1.4rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 15px 13px;text-decoration:none;color:var(--ink);min-height:128px}
.tile:hover{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.tile .g{font-family:var(--fh);font-weight:700;font-size:1.25rem;color:var(--teorie);letter-spacing:.02em}
.tile .n{font-family:var(--fh);font-weight:700;font-size:1.12rem;line-height:1.15}
.tile .d{font-size:.85rem;color:var(--ink2);margin-top:auto}
.tile.special{border-color:var(--ink);background:#fff}
.tile.special .g{color:var(--hard)}

/* ---------- stránka tématu ---------- */
.tp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tp-head h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.tglyph{font-family:var(--fh);font-weight:700;color:var(--teorie);font-size:1.3rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:4px 0 16px;overflow-x:auto}
.tab{padding:9px 14px;text-decoration:none;color:var(--ink2);font-weight:600;border:1.5px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.tab:hover:not(.on){color:var(--ink);background:rgba(23,35,58,.06)}

.box{border-radius:var(--r);margin:0 0 12px;border:1.5px solid}
.box>summary{cursor:pointer;padding:11px 16px;font-family:var(--fh);font-weight:700;font-size:1.12rem;list-style:none;display:flex;align-items:center;gap:8px}
.box>summary::-webkit-details-marker{display:none}
.box>summary::before{content:'+';display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;border:1.5px solid currentColor;font-size:1rem;line-height:1}
.box[open]>summary::before{content:'−'}
.box-in{padding:2px 18px 16px;overflow-x:auto}
.box.teorie{background:var(--teorie-bg);border-color:#B7C9EA}.box.teorie>summary{color:var(--teorie)}
.box.priklad{background:var(--priklad-bg);border-color:#CFC0EE}.box.priklad>summary{color:var(--priklad)}
.box-in h4{font-size:1.08rem;margin:16px 0 4px}
.twocol{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}
.sarrus{width:100%;max-width:260px}
.sarrus text{font-family:var(--fh);font-size:24px;font-weight:600;fill:var(--ink)}
.sarrus text.rep{fill:#8C99B0}
.sarrus .dg{stroke-width:2.4;opacity:.8}.sarrus .plus{stroke:var(--ok)}.sarrus .minus{stroke:var(--bad);stroke-dasharray:5 4}
.sarrus .sep{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:3 3}
.tag-plus{color:var(--ok);font-weight:700}.tag-minus{color:var(--bad);font-weight:700}
.stairs{border-collapse:collapse;font-family:var(--fh);font-size:1.15rem}
.stairs td{width:42px;height:38px;text-align:center;border:1px solid #C9D6EA;background:#fff}
.stairs td.z{background:#DCE6F5;color:#7E8DA6}
.stairs td.pv{background:var(--pencil);font-weight:700}
ul.ops,ol.proc{padding-left:1.3em;margin:.3em 0 .8em}
ul.ops li,ol.proc li{margin:3px 0}
.cases{border-collapse:collapse;width:100%;background:#fff;font-size:.95rem}
.cases th,.cases td{border:1px solid #C9D6EA;padding:8px 10px;text-align:left;vertical-align:middle}
.cases th{background:#DCE6F5;font-family:var(--fh)}

.practice{margin-top:20px}
.pr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pr-head h2{font-size:1.4rem;margin:0}
.diffsel{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.diffsel button{font:inherit;font-weight:600;font-size:.9rem;padding:7px 13px;border:0;background:var(--card);color:var(--ink);cursor:pointer;border-right:1.5px solid var(--ink)}
.diffsel button:last-child{border-right:0}
.diffsel button.on{background:var(--ink);color:#fff}
.diffsel button.on.d3{background:var(--hard)}

/* ---------- úloha ---------- */
.prob{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px 20px 20px;position:relative}
.prob.is-hard{border-top:6px solid var(--hard)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ph h3{font-size:1.3rem;margin:0 0 0 4px;flex-basis:100%}
.chip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:20px;background:#E6EBE6;color:var(--ink2)}
.chip.d1{background:var(--ok-bg);color:var(--ok)}.chip.d2{background:var(--teorie-bg);color:var(--teorie)}.chip.d3{background:var(--hard-bg);color:var(--hard)}
.stmt{font-size:1.05rem;padding:4px 0 6px;overflow-x:auto}
.tq{font-size:1.2rem;font-weight:600}
.parts{display:flex;flex-direction:column;gap:14px;margin:12px 0 14px;padding-top:14px;border-top:1.5px dashed var(--line)}
.part{padding:10px 12px;border-radius:7px;border:1.5px solid transparent;background:#F6F8F5}
.part.ok{background:var(--ok-bg);border-color:#A9D8BC}
.part.bad{background:var(--bad-bg);border-color:#EDB5AF}
.part.inv{background:var(--warn-bg);border-color:#EED29B}
.pl{display:block;font-weight:600;margin-bottom:6px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.pin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.in{font:inherit;font-size:1.05rem;padding:8px 11px;border:1.5px solid var(--ink2);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
.in:focus{border-color:var(--ink);outline:3px solid var(--pencil);outline-offset:0}
.in.w-s{width:150px}.in.w-l{width:min(420px,100%)}
textarea.in{width:100%;resize:vertical}
select{font:inherit;font-size:1rem;padding:8px 8px;border:1.5px solid var(--ink2);border-radius:6px;background:#fff;color:var(--ink)}
.fb{font-size:.95rem;margin-top:6px}
.part.ok .fb{color:var(--ok);font-weight:600}
.part.bad .fb{color:var(--bad)}
.part.inv .fb{color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--ink2)}
.opt input{margin-top:5px;accent-color:var(--ink)}
.k-choice .opts{flex-direction:row;flex-wrap:wrap}
.k-choice .opt{flex:1 1 200px}
.mgrid-wrap{overflow-x:auto}
.mgrid{border-collapse:separate;border-spacing:4px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);border-radius:4px;padding:2px 2px}
.mgrid input{width:56px;font:inherit;font-size:1.05rem;text-align:center;padding:7px 4px;border:1.5px solid var(--ink2);border-radius:5px;background:#fff}
.mgrid td.rhs{border-left:2.5px solid var(--ink);padding-left:8px}
.mgrid td.wrong input{border-color:var(--bad);background:var(--bad-bg)}
.lockmsg{color:var(--ink2);font-size:.92rem;margin:0}
.signpick,.signtab{border-collapse:collapse;background:#fff}
.signpick th,.signpick td,.signtab th,.signtab td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
.signpick th,.signtab th{background:#EEF2EE;font-weight:600;font-size:.92rem}
.sgn{font:inherit;font-size:1.3rem;font-weight:700;width:48px;height:40px;border-radius:6px;border:1.5px dashed var(--ink2);background:#fff;cursor:pointer;color:var(--ink2)}
.sgn.plus{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.sgn.minus{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.signpick td.wrong{background:var(--bad-bg);outline:2px solid var(--bad)}
.signtab td.sp{color:var(--ok);font-weight:700}.signtab td.sm{color:var(--bad);font-weight:700}
.signtab tr.tot td{border-top:2.5px solid var(--ink);font-size:1.1rem}
.signtab tr.tp td{color:var(--ink2);font-size:.9rem}
.tscroll{overflow-x:auto;max-width:100%}
.pickline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.pk.pt{border-style:dashed;background:#FAFBF9}
.pk:has(input:checked){border-color:var(--ink);background:#FFF8DB}
.pickres{margin-top:8px;font-size:1rem}
.selfrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.model{margin-top:10px;padding:10px 12px;background:var(--teorie-bg);border-radius:6px}

.acts{display:flex;flex-wrap:wrap;gap:8px}
.cap{font-size:.85rem;color:var(--ink2);margin:8px 0 0}
.hintbox{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hint{background:var(--teorie-bg);border-left:4px solid var(--teorie);padding:9px 13px;border-radius:0 6px 6px 0;overflow-x:auto}
.steps{list-style:none;counter-reset:st;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.steps:empty{display:none}
.steps>li{counter-increment:st;background:var(--priklad-bg);border-left:4px solid var(--priklad);padding:10px 14px;border-radius:0 6px 6px 0;overflow-x:auto}
.steps>li>h4{font-size:1.02rem;margin:0 0 4px;color:var(--priklad)}
.steps>li>h4::before{content:counter(st) '. ';}
.res{margin-top:12px;border-radius:7px}
.res:empty{display:none}
.res.ok{background:var(--ok-bg);border:1.5px solid var(--ok);padding:11px 14px;color:var(--ok)}
.res.bad{background:var(--bad-bg);border:1.5px solid var(--bad);padding:11px 14px;color:var(--bad)}
.res.bad-soft{background:var(--warn-bg);border:1.5px solid #E5C27E;padding:10px 14px;color:var(--warn)}
.res.info{background:var(--teorie-bg);border:1.5px solid var(--teorie);padding:10px 14px;color:var(--teorie)}
.sum{margin-top:6px;color:var(--ink)}
.nextwrap{margin-top:6px}

.cond,.warnbox{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:0 6px 6px 0;margin:6px 0;color:#5A3800}
.okbox{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 12px;border-radius:0 6px 6px 0;margin:6px 0}
.ok-line{color:var(--ok);font-weight:500}
.bad-line{color:var(--bad);font-weight:500}
.note{color:var(--ink2);font-size:.9rem;margin:2px 0 0}
.mscroll{overflow-x:auto}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:2px 0}

/* grafy */
.plot{width:100%;max-width:420px;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;margin:6px 0}
.plot .g{stroke:#EDF1ED;stroke-width:1}
.plot .ax{stroke:var(--ink);stroke-width:1.6}
.plot .axl,.plot .tk,.plot .ptl,.plot .vlt,.plot .fnl{font-family:var(--ff);font-size:11px;fill:var(--ink2)}
.plot .axl{font-size:13px;font-style:italic;fill:var(--ink)}
.plot .ptl{font-size:12px;font-weight:600;fill:var(--ink)}
.plot .fn{fill:none;stroke-width:2.6}
.plot .f0{stroke:var(--teorie);fill:var(--teorie)}.plot .f1{stroke:var(--hard);fill:var(--hard)}
.plot polyline.f0,.plot polyline.f1{fill:none}
.plot .vl{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:5 4}
.plot .vlt{fill:var(--warn);font-weight:600}
.plot .pt{fill:var(--ink);stroke:#fff;stroke-width:1.5}
.plot .pt.alt{fill:var(--ok)}
.nline{width:100%;max-width:520px;display:block;margin:8px 0}
.nline .ax{stroke:var(--ink);stroke-width:1.6}
.nline .sol{stroke:var(--ok);stroke-width:7;stroke-linecap:round;opacity:.55}
.nline .np{stroke:var(--ink);stroke-width:2}
.nline .np.full{fill:var(--ink)}.nline .np.hollow{fill:#fff}
.nline .np.den{stroke:var(--bad)}
.nline .nl{font-family:var(--fh);font-size:14px;font-weight:600;fill:var(--ink)}
.nline .sg{font-family:var(--fh);font-size:19px;font-weight:700}
.nline .plus{fill:var(--ok)}.nline .minus{fill:var(--bad)}

/* najdi chybu */
.ferr{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.fl{font:inherit;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;overflow-x:auto;color:var(--ink)}
.fl:hover{border-color:var(--ink)}
.fl.right{border-color:var(--ok);background:var(--ok-bg)}
.fl.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* relace, písemka, dril, souhrny */
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel h2{font-size:1.35rem}
.choicerow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.choicerow label{display:inline-flex;gap:7px;align-items:center;padding:8px 14px;border:1.5px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:600}
.choicerow label:has(input:checked){border-color:var(--ink);background:#FFF8DB}
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sess-head h1{font-size:1.8rem;margin:0}
.sess-prog{display:flex;align-items:center;gap:10px;min-width:240px;font-weight:600}
.sess-prog .bt{flex:1}
.exam-bar{position:sticky;top:52px;z-index:15;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);margin-bottom:14px}
.timer{font-family:var(--fh);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.timer.low{color:var(--pencil)}
.exam-q{margin-bottom:18px}
.exam-q>h2{font-size:1.25rem}
.exam-q>h2 small{color:var(--ink2);font-weight:500}
.exam-q .pts{font-family:var(--fh);font-weight:700;font-size:1.1rem;margin:8px 0}
.gradebox{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#fff;margin:10px 0}
.gradebox div{padding:12px 14px;border-right:1px solid var(--line)}
.gradebox div:last-child{border-right:0}
.gradebox .v{font-family:var(--fh);font-size:2rem;font-weight:700;line-height:1}
.gradebox .k{font-size:.85rem;color:var(--ink2)}
.errlist{padding-left:1.2em}.errlist li{margin:4px 0}
.drill{max-width:720px;margin:0 auto}
.drill-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r)}
.drill-top .timer{margin-left:0}
.drill-top .sc{font-weight:600;margin-left:auto}
.drill-card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px}
.drill-card .q{font-size:1.15rem;margin-bottom:12px;overflow-x:auto}
.drill-card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drill-card .fb{margin-top:12px;font-size:1rem}
.drill-card .fb.ok{color:var(--ok);font-weight:600}.drill-card .fb.bad{color:var(--bad)}
.tbl{border-collapse:collapse;width:100%;background:#fff}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.tbl th{background:#EEF2EE;font-family:var(--fh)}
.errbars{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
.empty{padding:20px;text-align:left;color:var(--ink2)}
footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--ink2);font-size:.82rem}

/* ---------- mobil ---------- */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero-art{order:-1;max-width:300px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(3){border-right:0}
  .stat:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .bars{grid-template-columns:1fr}
  .twocol{grid-template-columns:1fr}
  .gradebox{grid-template-columns:repeat(2,1fr)}
  .gradebox div:nth-child(2){border-right:0}
}
@media (max-width:520px){
  body{font-size:16px}
  main{padding:14px 10px 50px}
  .prob,.dash,.panel{padding:14px 13px}
  .bar{grid-template-columns:118px 1fr 40px;gap:8px}
  .brand span{display:none}
  .mgrid input{width:44px}
  .exam-bar{top:52px}
}

/* ---------- tisk ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;font-size:12pt}
  .topbar,footer,.acts,.nextwrap,.tabs,.diffsel,.crumbs,.cta-row{display:none!important}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  #printArea h1{font-size:18pt}
  .pa-meta{display:flex;justify-content:space-between;border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:10px}
  .pa-item{margin:0 0 8mm}
  .pa-item:not(.pa-sol){break-inside:avoid;page-break-inside:avoid}
  .pa-sol .steps>li,.pa-item h3,.pa-sol .stmt{break-inside:avoid;page-break-inside:avoid}
  .pa-item h3{break-after:avoid}
  .pa-item h3{font-size:13pt;margin:0 0 2mm}
  .pa-space{height:50mm;border:1px dashed #999;border-radius:4px;margin-top:3mm}
  .pa-sol .steps>li{background:none;border-left:2px solid #555}
  .pa-sol .steps>li>h4{color:#000}
  .cond,.warnbox,.okbox{background:none;border-left:2px solid #555;color:#000}
  .plot{max-width:60mm}
}

<div id="printArea" aria-hidden="true"></div>
<script>
'use strict';
/* =====================================================================
   ENGINE – matematika bez DOM: přesné zlomky, parsování, polynomy,
   intervaly, grafy (SVG jako text). Vše ostatní staví na tomhle.
   ===================================================================== */

/* ---------- náhoda ---------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
class Rng{
  constructor(seed){this.seed=(seed===undefined?Math.floor(Math.random()*2147483646)+1:seed)>>>0;this.f=mulberry32(this.seed);}
  next(){return this.f();}
  int(a,b){return a+Math.floor(this.f()*(b-a+1));}
  nz(a,b){let v;do{v=this.int(a,b);}while(v===0);return v;}
  pick(arr){return arr[Math.floor(this.f()*arr.length)];}
  chance(p){return this.f()<p;}
  shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.f()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
}

/* ---------- zlomky ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function lcm(a,b){return a/gcd(a,b)*b;}
class F{
  constructor(n,d=1){
    if(!Number.isInteger(n)||!Number.isInteger(d)) throw new Error('F: neceločíselné '+n+'/'+d);
    if(d===0) throw new Error('F: dělení nulou');
    if(d<0){n=-n;d=-d;}
    const g=gcd(n,d)||1; this.n=n/g+0; this.d=d/g;
  }
  static of(x){return x instanceof F?x:new F(x,1);}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){o=F.of(o);return new F(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d);}
  div(o){o=F.of(o);if(o.n===0) throw new Error('F: dělení nulou');return new F(this.n*o.d,this.d*o.n);}
  neg(){return new F(-this.n,this.d);}
  abs(){return new F(Math.abs(this.n),this.d);}
  eq(o){o=F.of(o);return this.n===o.n&&this.d===o.d;}
  cmp(o){o=F.of(o);return Math.sign(this.n*o.d-o.n*this.d);}
  lt(o){return this.cmp(o)<0;}
  gt(o){return this.cmp(o)>0;}
  isZero(){return this.n===0;}
  isInt(){return this.d===1;}
  sign(){return Math.sign(this.n);}
  val(){return this.n/this.d;}
  tex(){if(this.d===1) return String(this.n);return (this.n<0?'-':'')+'\\frac{'+Math.abs(this.n)+'}{'+this.d+'}';}
  str(){return this.d===1?String(this.n):this.n+'/'+this.d;}
}
const fr=(n,d=1)=>new F(n,d);
/* záporné číslo do závorky */
function pT(x){x=F.of(x);return x.sign()<0?'('+x.tex()+')':x.tex();}
/* koeficient před proměnnou: 1 → '', -1 → '-' */
function coefTex(k){k=F.of(k);return k.eq(1)?'':k.eq(-1)?'-':k.tex();}
/* koeficient před násobením číslem: 1 → '', -1 → '-', jinak 'k\cdot ' */
function coefMulTex(k){k=F.of(k);return k.eq(1)?'':k.eq(-1)?'-':k.tex()+'\\cdot ';}
/* desetinné číslo s českou čárkou, jinak zlomek */
function fmtDec(x,tex=true){
  x=F.of(x); let dd=x.d; while(dd%2===0) dd/=2; while(dd%5===0) dd/=5;
  if(dd!==1) return tex?x.tex():x.str().replace('-','−');
  let k=0; while(Math.pow(10,k)%x.d!==0) k++;
  const s=(x.n/x.d).toFixed(k);
  return tex? s.replace('.','{,}') : s.replace('.',',').replace('-','−');
}
/* spojí členy se znaménky: ['x','-3','2y'] → 'x - 3 + 2y' */
function joinTex(list){
  let s='';
  for(const t0 of list){
    if(t0===''||t0==null) continue; const t=String(t0);
    if(s===''){s=t;continue;}
    if(t[0]==='-') s+=' - '+t.slice(1).trim(); else s+=' + '+t;
  }
  return s===''?'0':s;
}

/* ---------- parsování vstupů od žáka ---------- */
function cleanNum(s){return String(s==null?'':s).trim().replace(/[\u2212\u2013]/g,'-').replace(/\s+/g,'');}
function parseNum(s){
  s=cleanNum(s).replace(/^[a-zA-Z][a-zA-Z_0-9{}]*=/,'');
  if(s==='') return null;
  let m;
  if((m=s.match(/^([+-]?\d+)\/([+-]?\d+)$/))){const d=parseInt(m[2],10);if(d===0) return null;return new F(parseInt(m[1],10),d);}
  if((m=s.match(/^([+-]?)(\d*)[.,](\d{1,9})$/))){const sg=m[1]==='-'?-1:1;return new F(sg*parseInt((m[2]||'0')+m[3],10),Math.pow(10,m[3].length));}
  if(/^[+-]?\d+$/.test(s)) return new F(parseInt(s,10),1);
  if((m=s.match(/^([+-]?\d*[.,]?\d+)\/([+-]?\d*[.,]?\d+)$/))){const a=parseNum(m[1]),b=parseNum(m[2]);if(a&&b&&!b.isZero()) return a.div(b);}
  return null;
}
const NONE_RE=/^(∅|\{\s*\}|nem[aá]|ž[aá]dn|zadn|nen[ií]|bez\b|neexist|nejsou|nic\b)/i;
function parseList(s){
  let t=String(s==null?'':s).trim().replace(/[\u2212\u2013]/g,'-');
  if(t==='') return {error:'Nic jsi nevyplnil.'};
  if(NONE_RE.test(t)) return {vals:[],none:true};
  t=t.replace(/[{}\[\]()]/g,' ').replace(/[a-zA-Z][\w]*\s*(?:≠|!=|<>|=)\s*/g,' ').replace(/≠/g,' ');
  t=t.replace(/([+-])\s+(?=\d)/g,'$1').replace(/,(?=\s)/g,';').replace(/\s+(a|nebo)\s+/gi,';');
  const toks=t.split(/[;\s]+/).filter(x=>x!=='');
  if(!toks.length) return {error:'Nic jsi nevyplnil.'};
  const vals=[];
  for(const tk of toks){
    const v=parseNum(tk);
    if(!v) return {error:'Nerozumím zápisu „'+tk+'“. Čísla odděluj středníkem, např. 0; 3'};
    if(!vals.some(u=>u.eq(v))) vals.push(v);
  }
  return {vals};
}
/* řádek čísel v pořadí (pro dril s řádkovou úpravou) */
function parseRow(s){
  let t=String(s==null?'':s).trim().replace(/[\u2212\u2013]/g,'-').replace(/[\[\]()|]/g,' ');
  t=t.replace(/([+-])\s+(?=\d)/g,'$1').replace(/,(?=\s)/g,';');
  const toks=t.split(/[;\s]+/).filter(x=>x!=='');
  const vals=[];
  for(const tk of toks){const v=parseNum(tk);if(!v) return {error:'Nerozumím „'+tk+'“. Čísla odděluj středníkem.'};vals.push(v);}
  if(!vals.length) return {error:'Nic jsi nevyplnil.'};
  return {vals};
}
function parsePoints(s){
  const t=String(s==null?'':s).trim().replace(/[\u2212\u2013]/g,'-');
  if(t==='') return {error:'Nic jsi nevyplnil.'};
  if(NONE_RE.test(t)) return {pts:[],none:true};
  const re=/[\[(]\s*([^;\])]+?)\s*;\s*([^\])]+?)\s*[\])]/g; let m; const pts=[];
  while((m=re.exec(t))){
    const x=parseNum(m[1]),y=parseNum(m[2]);
    if(!x||!y) return {error:'Nerozumím bodu „'+m[0]+'“. Piš např. [2;-3]'};
    if(!pts.some(p=>p[0].eq(x)&&p[1].eq(y))) pts.push([x,y]);
  }
  if(!pts.length){
    if(/\d/.test(t)) return {error:'Zadej celé body ve tvaru [x;y], ne jen x. Např. [0;3]; [4;11]'};
    return {error:'Nerozumím zápisu. Body piš jako [x;y].'};
  }
  return {pts};
}
/* intervaly: (-inf;-4)∪<0;3> , ⟨2;∞) , R , ∅ */
function parseIntervals(s){
  let t=String(s==null?'':s).trim().replace(/[\u2212\u2013]/g,'-').replace(/\s+/g,'');
  if(t==='') return {error:'Nic jsi nevyplnil.'};
  if(NONE_RE.test(t)) return {segs:[]};
  t=t.replace(/[⟨〈<]/g,'[').replace(/[⟩〉>]/g,']').replace(/∞|infinity|inf|oo/gi,'I');
  if(/^(R|ℝ)$/i.test(t)) return {segs:[{lo:null,loC:false,hi:null,hiC:false}]};
  const parts=t.split(/∪|U|u|\|/).filter(Boolean);
  const segs=[];
  for(const p of parts){
    let m=p.match(/^\{([^}]+)\}$/);
    if(m){const v=parseNum(m[1]);if(!v) return {error:'Nerozumím „'+p+'“.'};segs.push({lo:v,loC:true,hi:v,hiC:true});continue;}
    m=p.match(/^([\[(])([^;]+);([^\])]+)([\])])$/);
    if(!m) return {error:'Nerozumím intervalu „'+p+'“. Piš např. (-4;0)∪<3;4) – hranice odděluj středníkem.'};
    const loInf=/^-I$/.test(m[2]), hiInf=/^\+?I$/.test(m[3]);
    const lo=loInf?null:parseNum(m[2]), hi=hiInf?null:parseNum(m[3]);
    if((!loInf&&!lo)||(!hiInf&&!hi)) return {error:'Nerozumím hranici v „'+p+'“.'};
    if((loInf&&m[1]==='[')||(hiInf&&m[4]===']')) return {error:'U nekonečna patří vždy kulatá závorka.'};
    segs.push({lo,loC:!!lo&&m[1]==='[',hi,hiC:!!hi&&m[4]===']'});
  }
  return {segs};
}
function segSort(segs){return segs.slice().sort((a,b)=>{if(!a.lo) return -1;if(!b.lo) return 1;return a.lo.cmp(b.lo);});}
function segsEqual(a,b){
  if(a.length!==b.length) return false;
  a=segSort(a);b=segSort(b);
  const same=(u,v)=>(u===null&&v===null)||(u!==null&&v!==null&&u.eq(v));
  return a.every((s,i)=>same(s.lo,b[i].lo)&&same(s.hi,b[i].hi)&&(!s.lo||s.loC===b[i].loC)&&(!s.hi||s.hiC===b[i].hiC));
}
function segsTex(segs){
  if(!segs.length) return '\\emptyset';
  return segs.map(s=>{
    if(s.lo&&s.hi&&s.lo.eq(s.hi)) return '\\{'+s.lo.tex()+'\\}';
    if(!s.lo&&!s.hi) return '\\mathbb{R}';
    const L=s.lo?(s.loC?'\\langle ':'(')+s.lo.tex():'(-\\infty';
    const R=s.hi?s.hi.tex()+(s.hiC?'\\rangle':')'):'\\infty)';
    return L+';\\ '+R;
  }).join(' \\cup ');
}
/* body + intervaly → sjednocení úseků */
function buildSegs(pts,inclI,inclP){
  const k=pts.length, atoms=[];
  for(let i=0;i<=k;i++){atoms.push({t:'I',i,inc:inclI[i]});if(i<k) atoms.push({t:'P',i,inc:inclP[i]});}
  const segs=[]; let cur=null, last=null;
  const close=()=>{
    if(last.t==='I'){cur.hi=last.i===k?null:pts[last.i];cur.hiC=false;}
    else{cur.hi=pts[last.i];cur.hiC=true;}
    segs.push(cur);cur=null;
  };
  for(const a of atoms){
    if(a.inc){
      if(!cur) cur=a.t==='I'?{lo:a.i===0?null:pts[a.i-1],loC:false}:{lo:pts[a.i],loC:true};
      last=a;
    } else if(cur) close();
  }
  if(cur) close();
  return segs;
}

/* ---------- polynomy (koeficienty od x^0) ---------- */
const P={
  norm(p){p=p.map(F.of);while(p.length>1&&p[p.length-1].isZero()) p.pop();return p.length?p:[fr(0)];},
  add(a,b){const n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++) r.push(F.of(a[i]||0).add(F.of(b[i]||0)));return P.norm(r);},
  scale(a,k){return P.norm(a.map(c=>F.of(c).mul(k)));},
  sub(a,b){return P.add(a,P.scale(b,-1));},
  mul(a,b){const r=[];for(let i=0;i<a.length+b.length-1;i++) r.push(fr(0));a.forEach((x,i)=>b.forEach((y,j)=>{r[i+j]=r[i+j].add(F.of(x).mul(y));}));return P.norm(r);},
  prod(list){return list.reduce((acc,p)=>P.mul(acc,p),[fr(1)]);},
  deg(p){p=P.norm(p);return(p.length===1&&p[0].isZero())?-1:p.length-1;},
  isZero(p){return P.deg(p)===-1;},
  ev(p,x){x=F.of(x);let r=fr(0);for(let i=p.length-1;i>=0;i--) r=r.mul(x).add(F.of(p[i]));return r;},
  evf(p,x){let r=0;for(let i=p.length-1;i>=0;i--) r=r*x+F.of(p[i]).val();return r;},
  lin(a,b){return P.norm([F.of(b),F.of(a)]);},
  root(r){return P.lin(1,F.of(r).neg());},
  mono(p){return P.norm(p).filter(c=>!c.isZero()).length===1;},
  tex(p,v='x'){
    p=P.norm(p); let s='';
    for(let i=p.length-1;i>=0;i--){
      const c=p[i]; if(c.isZero()) continue;
      const neg=c.sign()<0, a=c.abs();
      const body=i===0?a.tex():(a.eq(1)?'':a.tex())+(i===1?v:v+'^{'+i+'}');
      if(s==='') s=(neg?'-':'')+body; else s+=(neg?' - ':' + ')+body;
    }
    return s===''?'0':s;
  },
  /* hezčí zápis lineárního dvojčlenu: 7 - 3x místo -3x + 7 */
  texNice(p,v='x'){
    p=P.norm(p);
    if(P.deg(p)===1&&p[1].sign()<0&&p[0].sign()>0) return p[0].tex()+' - '+(p[1].abs().eq(1)?'':p[1].abs().tex())+v;
    return P.tex(p,v);
  },
  varTerms(p){return P.norm(p).filter((c,i)=>i>0&&!c.isZero()).length;}
};
function sqrtF(x){x=F.of(x);if(x.n<0) return null;const a=Math.round(Math.sqrt(x.n)),b=Math.round(Math.sqrt(x.d));if(a*a===x.n&&b*b===x.d) return new F(a,b);return null;}
function quadInfo(p){
  p=P.norm(p); const c=p[0],b=p[1],a=p[2];
  const D=b.mul(b).sub(fr(4).mul(a).mul(c));
  if(D.sign()<0) return {D,roots:[],irr:false};
  const s=sqrtF(D); if(!s) return {D,roots:null,irr:true};
  const r1=b.neg().sub(s).div(a.mul(2)), r2=b.neg().add(s).div(a.mul(2));
  const roots=r1.eq(r2)?[r1]:[r1,r2].sort((u,w)=>u.cmp(w));
  return {D,s,roots,irr:false};
}
/* racionální kořeny polynomu stupně ≤ 2 (null = iracionální) */
function rationalRoots(p){
  p=P.norm(p); const d=P.deg(p);
  if(d<=0) return [];
  if(d===1) return [p[0].neg().div(p[1])];
  if(d===2) return quadInfo(p).roots;
  return null;
}
/* lineární činitel pro kořen r: (d·x − n) */
function linFac(r,v='x'){
  r=F.of(r);
  if(r.isZero()) return {t:v,mono:true,lead:1,p:[fr(0),fr(1)]};
  const d=r.d,n=r.n;
  return {t:'('+(d===1?'':d)+v+(n>0?' - '+n:' + '+(-n))+')',mono:false,lead:d,p:P.lin(d,-n)};
}
/* rozklad polynomu stupně ≤ 2 na součin (TeX) */
function factorTex(p,v='x'){
  p=P.norm(p); const dg=P.deg(p);
  if(dg<=0) return p[0].tex();
  let roots;
  if(dg===1) roots=[p[0].neg().div(p[1])];
  else{const q=quadInfo(p);if(!q.roots||!q.roots.length) return P.tex(p,v);roots=q.roots.length===1?[q.roots[0],q.roots[0]]:q.roots;}
  let c=F.of(p[dg]); const facs=roots.map(r=>linFac(r,v)); facs.forEach(f=>{c=c.div(f.lead);});
  let body;
  if(roots.length===2&&roots[0].eq(roots[1])) body=(facs[0].mono?v:facs[0].t)+'^{2}';
  else{facs.sort((a,b)=>(b.mono?1:0)-(a.mono?1:0));body=facs.map(f=>f.t).join('');}
  if(facs.length===1&&!facs[0].mono&&c.eq(1)) body=body.slice(1,-1);
  return coefTex(c)+body;
}
/* součin: koeficient × polynomy, např. 2x(x-2) */
function texProduct(coef,polys,v='x'){
  coef=F.of(coef); const ps=[];
  for(const p of polys){if(P.deg(p)<=0) coef=coef.mul(P.norm(p)[0]);else ps.push(P.norm(p));}
  if(coef.isZero()) return '0';
  if(!ps.length) return coef.tex();
  ps.sort((a,b)=>(P.mono(b)?1:0)-(P.mono(a)?1:0));
  const body=ps.map((p,i)=>(P.mono(p)&&(i===0||P.norm(p)[1]&&P.norm(p)[1].eq(1)&&P.deg(p)===1))?P.tex(p,v):'('+P.tex(p,v)+')').join('');
  let c=coef.eq(1)?'':coef.eq(-1)?'-':coef.tex();
  if(c&&coef.d!==1) c+='\\cdot ';
  return c+body;
}

/* ---------- matice a soustavy ---------- */
const VARS3=['x','y','z'], VARS4=['x','y','z','u'];
function matTex(M,o={}){
  const m=M[0].length; const spec=o.aug?'r'.repeat(m-1)+'|r':'r'.repeat(m);
  const body=M.map(r=>r.map(v=>F.of(v).tex()).join(' & ')).join(' \\\\ ');
  return o.bars?'\\left|\\begin{array}{'+spec+'}'+body+'\\end{array}\\right|':'\\left[\\begin{array}{'+spec+'}'+body+'\\end{array}\\right]';
}
function vecTex(b){return matTex(b.map(v=>[v]));}
function texLinLHS(coefs,vars){const t=[];coefs.forEach((c,i)=>{c=F.of(c);if(c.isZero()) return;t.push(coefTex(c)+vars[i]);});return joinTex(t);}
function texSystem(A,b,vars){return '\\begin{aligned}'+A.map((r,i)=>texLinLHS(r,vars)+' &= '+F.of(b[i]).tex()).join(' \\\\ ')+'\\end{aligned}';}

function autoWindow(xs,ys,minW=8,minH=8){
  let x0=Math.min(...xs)-2,x1=Math.max(...xs)+2,y0=Math.min(...ys,0)-2,y1=Math.max(...ys,0)+2;

/* =====================================================================
   SOUSTAVY: determinanty a Cramer, Gaussova eliminace, počet řešení
   ===================================================================== */
function det3(M){
  const m=M.map(r=>r.map(F.of));
  return m[0][0].mul(m[1][1]).mul(m[2][2]).add(m[0][1].mul(m[1][2]).mul(m[2][0])).add(m[0][2].mul(m[1][0]).mul(m[2][1]))
    .sub(m[0][2].mul(m[1][1]).mul(m[2][0])).sub(m[0][0].mul(m[1][2]).mul(m[2][1])).sub(m[0][1].mul(m[1][0]).mul(m[2][2]));
}
function replaceCol(M,j,b){return M.map((r,i)=>r.map((v,k)=>k===j?F.of(b[i]):F.of(v)));}
function sarrusTex(M,name){
  const m=M.map(r=>r.map(F.of));
  /* řádková varianta: první dva řádky opsané pod matici */
  const pl=[[m[0][0],m[1][1],m[2][2]],[m[1][0],m[2][1],m[0][2]],[m[2][0],m[0][1],m[1][2]]];
  const mi=[[m[0][2],m[1][1],m[2][0]],[m[1][2],m[2][1],m[0][0]],[m[2][2],m[0][1],m[1][0]]];
  const pr=t=>t.map(pT).join('\\cdot ');
  const val=t=>t[0].mul(t[1]).mul(t[2]);
  const pv=pl.map(val), mv=mi.map(val);
  const S1=pv.reduce((a,b)=>a.add(b)), S2=mv.reduce((a,b)=>a.add(b)), D=S1.sub(S2);
  const ext='\\begin{array}{rrr}'+[0,1,2,0,1].map((i,k)=>(k===3?'\\hline ':'')+m[i].map(v=>v.tex()).join(' & ')).join(' \\\\ ')+'\\end{array}';
  const tex='\\begin{aligned} '+name+' &= '+matTex(m,{bars:true})+'\\quad\\longrightarrow\\quad '+ext+' \\\\ &= '+pl.map(pr).join(' + ')+' \\\\ &\\quad - '+mi.map(pr).join(' - ')+
    ' \\\\ &= ('+joinTex(pv.map(x=>x.tex()))+') - ('+joinTex(mv.map(x=>x.tex()))+') \\\\ &= '+S1.tex()+' - '+pT(S2)+' = '+D.tex()+' \\end{aligned}';
  return {D,tex};
}

/* ---------- Cramer ---------- */
function buildCramer(A,b,diff=2,opts={}){
  A=A.map(r=>r.map(F.of)); b=b.map(F.of);
  const sD=sarrusTex(A,'D'), D=sD.D;
  if(D.isZero()) throw new Error('D=0');
  const Ms=[0,1,2].map(j=>replaceCol(A,j,b));
  const ss=Ms.map((M,j)=>sarrusTex(M,'D_'+VARS3[j]));
  const ds=ss.map(s=>s.D), sol=ds.map(d=>d.div(D));
  const parts=[
    {id:'D',kind:'num',label:'\\(D=\\)',ans:D,
     wrong:v=>v.eq(D.neg())?'Máš opačné znaménko. U Sarrusova pravidla se součiny vedlejších diagonál odčítají.':'D nevychází. Zkontroluj šest součinů na diagonálách – hlavně znaménka.'},
    ...VARS3.map((v,i)=>({id:'D'+v,kind:'num',label:'\\(D_'+v+'=\\)',ans:ds[i],
      wrong:w=>(w.eq(D)&&!D.eq(ds[i]))?'To je D. U \\(D_'+v+'\\) nahraď '+(i+1)+'. sloupec pravými stranami.':
        (!ds[i].isZero()&&w.eq(ds[i].neg()))?'Opačné znaménko – zkontroluj odečtení vedlejších diagonál.':
        '\\(D_'+v+'\\) vznikne tak, že v matici A nahradíš '+(i+1)+'. sloupec (koeficienty u '+v+') sloupcem pravých stran.'})),
    ...VARS3.map((v,i)=>({id:v,kind:'num',label:'\\('+v+'=\\)',ans:sol[i],
      wrong:w=>(!D.eq(1)&&w.eq(ds[i])&&!ds[i].isZero())?'To je \\(D_'+v+'\\). Ještě vyděl determinantem D: \\('+v+'=\\frac{D_'+v+'}{D}\\).':
        (!ds[i].isZero()&&w.eq(D.div(ds[i])))?'Zlomek máš obráceně – správně je \\('+v+'=\\frac{D_'+v+'}{D}\\).':null}))
  ];
  const check0=joinTex(A[0].map((c,i)=>c.isZero()?'':coefMulTex(c)+pT(sol[i])));
  const steps=[
    {t:'Matice soustavy a pravé strany',h:'\\[A='+matTex(A)+',\\qquad \\vec b='+vecTex(b)+'\\]<p>Matice A obsahuje jen koeficienty u neznámých. Pravé strany jsou zvlášť.</p>'},
    {t:'Determinant soustavy D (Sarrusovo pravidlo)',h:'\\['+sD.tex+'\\]<p class="ok-line">D ≠ 0, takže soustava má právě jedno řešení a Cramerovo pravidlo lze použít.</p>'},
    ...VARS3.map((v,i)=>({t:'\\(D_'+v+'\\): '+(i+1)+'. sloupec nahradíme pravými stranami',h:'\\['+ss[i].tex+'\\]'})),
    {t:'Řešení podle Cramerova pravidla',h:'\\[x=\\frac{D_x}{D}=\\frac{'+ds[0].tex()+'}{'+D.tex()+'}='+sol[0].tex()+',\\quad y=\\frac{D_y}{D}=\\frac{'+ds[1].tex()+'}{'+D.tex()+'}='+sol[1].tex()+',\\quad z=\\frac{D_z}{D}=\\frac{'+ds[2].tex()+'}{'+D.tex()+'}='+sol[2].tex()+'\\]'+
      '<p>Zkouška v 1. rovnici: \\('+check0+'='+b[0].tex()+'\\) ✓</p>'}
  ];
  return {topic:'cramer',diff,title:opts.title||'Soustava tří rovnic – determinanty',
    statement:'<p>Vyřeš soustavu pomocí determinantů (Cramerovo pravidlo):</p>\\['+texSystem(A,b,VARS3)+'\\]',
    parts,checkOnly:'D',
    hints:['Matice koeficientů je \\(A='+matTex(A)+'\\). D spočítej Sarrusovým pravidlem: opiš první dva řádky pod matici, sečti součiny na třech hlavních diagonálách (↘) a odečti součiny na třech vedlejších (↙).',
      '\\(D_x\\): v matici A nahraď 1. sloupec sloupcem pravých stran \\('+vecTex(b)+'\\), tedy \\(D_x='+matTex(Ms[0],{bars:true})+'\\). Stejně \\(D_y\\) (2. sloupec) a \\(D_z\\) (3. sloupec). Nakonec \\(x=\\frac{D_x}{D}\\) atd.'],
    steps,summary:'\\(D='+D.tex()+',\\ x='+sol[0].tex()+',\\ y='+sol[1].tex()+',\\ z='+sol[2].tex()+'\\)',
    printTask:'Urči \\(D,\\ D_x,\\ D_y,\\ D_z\\) a řešení soustavy.',data:{A,b,sol,D,ds}};
}
function genCramer(rng,diff=2){
  const cfg={1:{c:2,s:3,maxD:20,maxB:15},2:{c:4,s:4,maxD:60,maxB:30},3:{c:6,s:5,maxD:160,maxB:60}}[diff];
  for(let t=0;t<3000;t++){
    const sol=[0,1,2].map(()=>rng.int(-cfg.s,cfg.s));
    if(sol.filter(v=>v===0).length>1) continue;
    const A=[0,1,2].map(()=>[0,1,2].map(()=>diff===1&&rng.chance(0.4)?rng.pick([1,-1,1]):rng.int(-cfg.c,cfg.c)));
    if(diff===1) A[0][0]=1;
    if(A.some(r=>r.every(v=>v===0))||[0,1,2].some(j=>A.every(r=>r[j]===0))) continue;
    const zeros=A.flat().filter(v=>v===0).length;
    if(zeros>(diff===1?3:diff===2?2:1)) continue;
    const D=det3(A).val();
    if(D===0||Math.abs(D)>cfg.maxD||(diff>=2&&Math.abs(D)<2)) continue;
    const b=A.map(r=>r[0]*sol[0]+r[1]*sol[1]+r[2]*sol[2]);
    if(b.some(v=>Math.abs(v)>cfg.maxB)) continue;
    return buildCramer(A,b,diff);
  }
  throw new Error('genCramer');
}

/* ---------- Gaussova eliminace ---------- */
const rowInt=r=>r.every(v=>v.isInt());
function gaussEliminate(Aug0){
  const M=Aug0.map(r=>r.map(F.of)); const n=M.length, m=M[0].length, nv=m-1;
  const steps=[]; const clone=X=>X.map(row=>row.slice()); const R=i=>'R_{'+(i+1)+'}';
  let r=0; const piv=[];
  const reduce=(from)=>{
    const before=clone(M), ops=[];
    for(let i=from;i<n;i++){
      if(!rowInt(M[i])) continue;
      const g=M[i].reduce((acc,v)=>gcd(acc,v.n),0);
      if(g>1){M[i]=M[i].map(v=>v.div(g));ops.push(R(i)+' \\to \\frac{1}{'+g+'}'+R(i));}
    }
    if(ops.length) steps.push({ops,before,after:clone(M),note:'Řádek vydělíme – počítá se pak s menšími čísly.'});
  };
  for(let c=0;c<m&&r<n;c++){
    reduce(r);
    let best=-1,bs=Infinity;
    for(let i=r;i<n;i++){const v=M[i][c];if(v.isZero()) continue;const a=Math.abs(v.val());const sc=(a===1?0:a)+(i===r?-0.5:0)+(v.d!==1?100:0);if(sc<bs){bs=sc;best=i;}}
    if(best<0) continue;
    if(best!==r){const before=clone(M);[M[r],M[best]]=[M[best],M[r]];steps.push({ops:[R(r)+' \\leftrightarrow '+R(best)],before,after:clone(M),note:'Prohodíme řádky, aby byl pivot co nejjednodušší.'});}
    if(M[r][c].eq(-1)){const before=clone(M);M[r]=M[r].map(v=>v.neg());steps.push({ops:[R(r)+' \\to -'+R(r)],before,after:clone(M),note:'Vynásobíme −1, ať je pivot 1.'});}
    const before=clone(M), ops=[];
    for(let i=r+1;i<n;i++){
      const q=M[i][c]; if(q.isZero()) continue; const p=M[r][c]; const k=q.div(p);
      if(k.isInt()){
        M[i]=M[i].map((v,j)=>v.sub(k.mul(M[r][j])));
        ops.push(R(i)+' \\to '+R(i)+(k.sign()>0?' - ':' + ')+coefTex(k.abs())+R(r));
      } else if(rowInt(M[r])&&rowInt(M[i])){
        const g=gcd(p.n,q.n), a=Math.abs(p.n)/g, kk=q.n*Math.sign(p.n)/g;
        M[i]=M[i].map((v,j)=>v.mul(a).sub(fr(kk).mul(M[r][j])));
        ops.push(R(i)+' \\to '+(a===1?'':a)+R(i)+(kk>0?' - ':' + ')+(Math.abs(kk)===1?'':Math.abs(kk))+R(r));
      } else {
        M[i]=M[i].map((v,j)=>v.sub(k.mul(M[r][j])));
        ops.push(R(i)+' \\to '+R(i)+(k.sign()>0?' - ':' + ')+coefTex(k.abs())+R(r));
      }
    }
    if(ops.length) steps.push({ops,before,after:clone(M)});
    piv.push(c); r++;
  }
  reduce(0);
  const zr=(row,upto)=>row.slice(0,upto).every(v=>v.isZero());
  return {steps,M,rankA:M.filter(row=>!zr(row,nv)).length,rankAug:M.filter(row=>!zr(row,m)).length,piv,nv};
}
function backSub(M,vars){
  const n=vars.length, sol=Array(n), lines=[];
  for(let i=n-1;i>=0;i--){
    const row=M[i]; const eq=texLinLHS(row.slice(0,n),vars)+' = '+row[n].tex();
    let rhs=row[n]; const subs=[];
    for(let j=i+1;j<n;j++){if(row[j].isZero()) continue;rhs=rhs.sub(row[j].mul(sol[j]));subs.push(coefMulTex(row[j])+pT(sol[j]));}
    const a=row[i]; sol[i]=rhs.div(a);
    let line=eq;
    if(subs.length){line+=' \\;\\Rightarrow\\; '+joinTex([coefTex(a)+vars[i],...subs])+' = '+row[n].tex();line+=' \\;\\Rightarrow\\; '+coefTex(a)+vars[i]+' = '+rhs.tex();}
    if(!a.eq(1)) line+=' \\;\\Rightarrow\\; '+vars[i]+' = '+sol[i].tex();
    lines.push(line);
  }
  return {sol,lines};
}
function gaussStepsHtml(steps){
  return steps.map((s,k)=>({t:'Úprava '+(k+1)+': \\('+s.ops.join(',\\;\\; ')+'\\)',
    h:'<div class="mscroll">\\['+matTex(s.before,{aug:true})+'\\;\\sim\\;'+matTex(s.after,{aug:true})+'\\]</div>'+(s.note?'<p class="note">'+s.note+'</p>':'')}));
}
function buildGauss(A,b,diff=2,opts={}){
  const n=A.length, vars=n===4?VARS4:VARS3;
  const Aug=A.map((r,i)=>[...r.map(F.of),F.of(b[i])]);
  const res=gaussEliminate(Aug);
  if(res.rankA<n) throw new Error('singular');
  const bs=backSub(res.M,vars);
  const parts=[
    {id:'aug',kind:'matrix',rows:n,cols:n+1,aug:true,ans:Aug,label:'Zapiš rozšířenou matici soustavy:'},
    ...vars.map((v,i)=>({id:v,kind:'num',label:'\\('+v+'=\\)',ans:bs.sol[i]}))
  ];
  const steps=[
    {t:'Rozšířená matice',h:'\\['+matTex(Aug,{aug:true})+'\\]<p>Vlevo od čáry koeficienty, vpravo pravé strany. Chybějící neznámá = 0.</p>'},
    ...gaussStepsHtml(res.steps),
    {t:'Schodový tvar',h:'<div class="mscroll">\\['+matTex(res.M,{aug:true})+'\\]</div><p>Pod každým pivotem jsou nuly. Pivotů je '+n+' = počet neznámých, takže soustava má právě jedno řešení.</p>'},

      res.steps.length?'Začni úpravou \\('+res.steps[0].ops.join(',\\;')+'\\). Cílem je schodový tvar – pod pivoty nuly. Jednotkovou matici dělat nemusíš.':'Matice už je ve schodovém tvaru – rovnou dopočítej zpětným chodem.'],
    steps,summary:'\\(['+bs.sol.map(s=>s.tex()).join(';\\ ')+']\\)',

function genGauss(rng,diff=2,n=3){
  const cfg=n===4?{c:3,s:3,max:150,maxB:40}:{1:{c:3,s:3,max:30,maxB:20},2:{c:5,s:4,max:60,maxB:35},3:{c:6,s:5,max:130,maxB:60}}[diff];
  for(let t=0;t<4000;t++){
    const sol=Array.from({length:n},()=>rng.int(-cfg.s,cfg.s));
    const A=Array.from({length:n},()=>Array.from({length:n},()=>rng.int(-cfg.c,cfg.c)));
    if(n===3&&diff===1){A[0][0]=1;}
    if(n===3&&diff===3&&A.some(r=>Math.abs(r[0])===1)) continue;
    if(A.some(r=>r.every(v=>v===0))) continue;
    if(A.flat().filter(v=>v===0).length>(n===4?5:diff===1?3:2)) continue;
    const b=A.map(r=>r.reduce((s,v,j)=>s+v*sol[j],0));
    if(b.some(v=>Math.abs(v)>cfg.maxB)) continue;
    const res=gaussEliminate(A.map((r,i)=>[...r,b[i]]));
    if(res.rankA<n) continue;
    const mx=Math.max(...res.steps.flatMap(s=>s.after.flat().map(v=>Math.abs(v.val()))),0);
    if(mx>cfg.max||res.M.flat().some(v=>!v.isInt())) continue;
    if(res.steps.length>(n===4?9:6)) continue;
    return buildGauss(A,b,n===4?3:diff);
  }
  throw new Error('genGauss');
}

/* ---------- počet řešení ---------- */
function isEchelon(M){
  let last=-1, zero=false;
  for(const row of M){
    const lead=row.findIndex(v=>!F.of(v).isZero());
    if(lead===-1){zero=true;continue;}
    if(zero||lead<=last) return false;
    last=lead;
  }
  return true;
}
function buildPocet(Aug,diff=2){
  const M=Aug.map(r=>r.map(F.of)); const nv=M[0].length-1;
  const ech=isEchelon(M);
  const res=gaussEliminate(M);
  const h=res.rankA, hb=res.rankAug;
  const type=h<hb?'none':h===nv?'one':'inf';
  const fin=ech?M:res.M;
  const badRow=fin.findIndex(r=>r.slice(0,nv).every(v=>v.isZero())&&!r[nv].isZero());
  const names={one:'právě jedno řešení',none:'žádné řešení',inf:'nekonečně mnoho řešení'};
  let concl;
  if(type==='none') concl='<p>Řádek \\(['+fin[badRow].slice(0,nv).map(()=>'0').join('\\;\\;')+'\\mid '+fin[badRow][nv].tex()+']\\) znamená rovnici \\(0='+fin[badRow][nv].tex()+'\\) – to je <b>spor</b>. Hodnost \\(h(A)='+h+'\\neq h(A|b)='+hb+'\\), soustava nemá řešení.</p>';
  else if(type==='one') concl='<p>Pivotů je '+h+' a neznámých také '+nv+'. \\(h(A)=h(A|b)='+h+'=n\\) → právě jedno řešení.</p>';
  else concl='<p>Pivotů je jen '+h+', neznámých je '+nv+'. \\(h(A)=h(A|b)='+h+'\\lt n='+nv+'\\) → nekonečně mnoho řešení. Volných proměnných: \\(n-h='+nv+'-'+h+'='+(nv-h)+'\\).</p>';
  const steps=[
    ...(ech?[{t:'Matice je už ve schodovém tvaru',h:'<div class="mscroll">\\['+matTex(M,{aug:true})+'\\]</div>'}]:[{t:'Nejdřív převedeme do schodového tvaru',h:'<div class="mscroll">\\['+matTex(M,{aug:true})+'\\]</div>'},...gaussStepsHtml(res.steps),{t:'Schodový tvar',h:'<div class="mscroll">\\['+matTex(res.M,{aug:true})+'\\]</div>'}]),
    {t:'Rozbor: pivoty a hodnost',h:concl}
  ];
  return {topic:'pocet',diff,title:'Kolik má soustava řešení?',
    statement:'<p>Rozšířená matice soustavy o '+nv+' neznámých ('+Array.from({length:nv},(_,i)=>'\\(x_'+(i+1)+'\\)').join(', ')+'):</p><div class="mscroll">\\['+matTex(M,{aug:true})+'\\]</div>',
    parts:[{id:'typ',kind:'choice',label:'Kolik má soustava řešení?',options:[{v:'one',l:'právě jedno'},{v:'none',l:'žádné'},{v:'inf',l:'nekonečně mnoho'}],ans:type,
      wrong:v=>type==='none'?'Podívej se na řádky, které mají vlevo samé nuly – co je za čarou?':type==='inf'?'Spočítej pivoty (nenulové řádky vlevo) a porovnej s počtem neznámých.':'Každá neznámá má svůj pivot a není tu spor – zkontroluj to.'}],
    hints:['Nejdřív matici převeď do schodového tvaru (pokud v něm není). Pak spočítej pivoty = nenulové řádky v levé části.',
      'Řádek \\(0\\;0\\;0\\mid c\\) s \\(c\\neq0\\) = spor → žádné řešení. Pivotů méně než neznámých (a žádný spor) → nekonečně mnoho. Pivotů stejně jako neznámých → právě jedno.'],
    steps,summary:names[type],printTask:'Rozhodni, kolik má soustava řešení, a zdůvodni to.',data:{type,h,hb,nv,M}};
}
function genPocet(rng,diff=2){
  for(let t=0;t<2000;t++){
    const type=rng.pick(['one','none','inf']);
    const nv=diff===1?3:rng.pick([3,4]);
    const rows=nv;
    let rk=type==='one'?nv:nv-1-(nv===4&&rng.chance(0.35)?1:0);
    let cols=[0];
    while(cols.length<rk){const c=rng.int(1,nv-1);if(!cols.includes(c)) cols.push(c);}
    cols.sort((a,b)=>a-b);
    if(type==='one') cols=Array.from({length:nv},(_,i)=>i);
    const M=Array.from({length:rows},()=>Array(nv+1).fill(0));
    cols.forEach((pc,k)=>{
      M[k][pc]=diff===1&&rng.chance(0.6)?1:rng.nz(-3,3);
      for(let j=pc+1;j<nv;j++) M[k][j]=rng.int(-4,4);
      M[k][nv]=rng.int(-6,6);
    });
    if(type==='none') M[rk][nv]=rng.nz(-7,7);
    if(diff>=2){
      const ops=diff===2?1:rng.int(2,3);
      for(let o=0;o<ops;o++){
        const i=rng.int(0,rows-1), j=rng.int(0,rows-1); if(i===j) continue;
        const k=rng.pick([1,-1,2,-2]);
        M[i]=M[i].map((v,c)=>v+k*M[j][c]);
      }
      if(rng.chance(0.4)){const i=rng.int(0,rows-2);[M[i],M[i+1]]=[M[i+1],M[i]];}
      if(diff===2&&isEchelon(M.map(r=>r.map(F.of)))&&rng.chance(0.5)) continue;
    }
    if(M.flat().some(v=>Math.abs(v)>15)) continue;
    const pr=buildPocet(M,diff);
    if(pr.data.type!==type) continue;
    return pr;
  }
  throw new Error('genPocet');
}

const X1=[fr(0),fr(1)]; /* polynom x */
const xp=r=>P.root(r);  /* x − r */

/* ---------- lomené rovnice ---------- */
/* eq = {v, factors:[lineární polynomy], L:[členy], R:[členy]}, člen = {num, fac:[indexy], show:'exp'|'fac'} */
function denTexOf(t,eq){
  const facs=t.fac.map(i=>eq.factors[i]);
  if(facs.length===1) return P.tex(facs[0],eq.v);
  if(t.show==='exp') return P.tex(P.prod(facs),eq.v);
  return facs.map(f=>P.mono(f)?P.tex(f,eq.v):'('+P.tex(f,eq.v)+')').join('');
}
function termTex(t,eq){
  const num=P.norm(t.num);
  if(!t.fac.length) return P.deg(num)<=0?num[0].tex():P.tex(num,eq.v);
  const dt=denTexOf(t,eq);
  if(P.deg(num)<=0){const c=num[0];return (c.sign()<0?'-':'')+'\\frac{'+c.abs().tex()+'}{'+dt+'}';}
  return '\\frac{'+P.tex(num,eq.v)+'}{'+dt+'}';
}
function termVal(t,eq,x){
  const den=P.prod(t.fac.map(i=>eq.factors[i]));
  return P.ev(t.num,x).div(P.ev(den,x));
}
function solveRov(eq){
  const v=eq.v, all=[...eq.L,...eq.R];
  const conds=eq.factors.map(f=>P.norm(f)[0].neg().div(P.norm(f)[1])).sort((a,b)=>a.cmp(b));
  let Lc=1; for(const t of all) for(const c of P.norm(t.num)) Lc=lcm(Lc,F.of(c).d);
  const used=[...new Set(all.flatMap(t=>t.fac))].sort((a,b)=>a-b);
  const mult=t=>used.filter(i=>!t.fac.includes(i)).map(i=>eq.factors[i]);
  const expand=t=>P.scale(P.mul(t.num,P.prod(mult(t))),Lc);
  const prodTex=t=>texProduct(fr(Lc),[t.num,...mult(t)],v);
  const lhs=eq.L.map(expand).reduce((a,b)=>P.add(a,b),[fr(0)]), rhs=eq.R.map(expand).reduce((a,b)=>P.add(a,b),[fr(0)]);
  const poly=P.sub(lhs,rhs);
  let norm=poly, divisor=fr(1);
  if(!P.isZero(poly)){
    const g=poly.reduce((acc,c)=>gcd(acc,c.n),0)||1; const lead=poly[poly.length-1].sign();
    divisor=fr(g*lead); norm=P.scale(poly,fr(1).div(divisor));
  }
  const deg=P.deg(norm);
  const qi=deg===2?quadInfo(norm):null;
  const roots=deg===-1?null:rationalRoots(norm);
  const lcdTex=(Lc>1?Lc:'')+texProduct(1,used.map(i=>eq.factors[i]),v);
  const valid=roots?roots.filter(r=>!conds.some(c=>c.eq(r))):[];
  const excluded=roots?roots.filter(r=>conds.some(c=>c.eq(r))):[];
  return {conds,Lc,used,lcdTex,prodL:joinTex(eq.L.map(prodTex)),prodR:joinTex(eq.R.map(prodTex)),lhs,rhs,poly,norm,divisor,deg,qi,roots,valid,excluded,identity:deg===-1};
}
function eqTex(eq){return joinTex(eq.L.map(t=>termTex(t,eq)))+' = '+joinTex(eq.R.map(t=>termTex(t,eq)));}
function quadSolveTex(norm,v){
  const q=quadInfo(norm); const [c,b,a]=P.norm(norm);
  let s='\\[D=b^2-4ac='+pT(b)+'^2-4\\cdot '+pT(a)+'\\cdot '+pT(c)+'='+q.D.tex()+'\\]';
  if(q.D.sign()<0) return s+'<p>D &lt; 0 → rovnice nemá reálné kořeny.</p>';
  if(q.roots.length===1) return s+'\\['+v+'=\\frac{-b}{2a}='+q.roots[0].tex()+'\\quad\\text{(dvojnásobný kořen)}\\]';
  return s+'\\['+v+'_{1,2}=\\frac{'+b.neg().tex()+'\\pm\\sqrt{'+q.D.tex()+'}}{'+a.mul(2).tex()+'}=\\frac{'+b.neg().tex()+'\\pm '+q.s.tex()+'}{'+a.mul(2).tex()+'}\\]'+
    '\\['+v+'_1='+q.roots[0].tex()+',\\qquad '+v+'_2='+q.roots[1].tex()+'\\]<p>Kontrola rozkladem: \\('+factorTex(norm,v)+'=0\\)</p>';
}
function buildRov(eq,diff=2,opts={}){
  const v=eq.v||'x'; eq.v=v; const S=solveRov(eq);
  if(!S.roots&&!S.identity) throw new Error('irrational');
  const factored=[...eq.L,...eq.R].filter(t=>t.fac.length>1&&t.show==='exp');
  const condTex=S.conds.map(c=>v+'\\neq '+c.tex()).join(',\\;\\; ');
  const steps=[];
  steps.push({t:'Rozklad jmenovatelů',h:factored.length?factored.map(t=>'\\['+P.tex(P.prod(t.fac.map(i=>eq.factors[i])),v)+'='+texProduct(1,t.fac.map(i=>eq.factors[i]),v)+'\\]').join(''):'<p>Jmenovatele jsou už rozložené na součin.</p>'});
  steps.push({t:'Podmínky',h:'<div class="cond">Žádný jmenovatel nesmí být 0: \\('+condTex+'\\)</div>'});
  steps.push({t:'Společný jmenovatel',h:'<p>Společný jmenovatel je \\('+S.lcdTex+'\\). Vynásobíme jím <b>celou</b> rovnici – každý člen na obou stranách.</p>'});
  steps.push({t:'Po vynásobení (zlomky zmizí)',h:'\\['+S.prodL+' = '+S.prodR+'\\]'});
  let st5='\\['+P.tex(S.lhs,v)+' = '+P.tex(S.rhs,v)+'\\]\\['+P.tex(S.poly,v)+' = 0\\]';
  if(!S.divisor.eq(1)&&!S.identity) st5+='<p>Vydělíme \\('+pT(S.divisor)+'\\):</p>\\['+P.tex(S.norm,v)+' = 0\\]';
  steps.push({t:'Roznásobíme a převedeme na jednu stranu',h:st5});
  let st6;
  if(S.identity) st6='<p>Vyšlo 0 = 0 – rovnost platí pro každé \\('+v+'\\), které splňuje podmínky.</p>';
  else if(S.deg===0) st6='<p>Vyšlo \\('+P.tex(S.norm,v)+'=0\\), což neplatí nikdy – rovnice nemá řešení.</p>';
  else if(S.deg===1) st6='\\['+v+'='+S.roots[0].tex()+'\\]';

    if(S.conds.some(c=>c.eq(r))) return '<p class="bad-line">\\('+v+'='+r.tex()+'\\) ✗ nevyhovuje podmínce – jmenovatel by byl roven nule, kořen vyřadíme.</p>';
    const Lv=eq.L.reduce((s,t)=>s.add(termVal(t,eq,r)),fr(0)), Rv=eq.R.reduce((s,t)=>s.add(termVal(t,eq,r)),fr(0));
    return '<p class="ok-line">\\('+v+'='+r.tex()+'\\) ✓ splňuje podmínky. Zkouška: \\(L='+Lv.tex()+',\\ P='+Rv.tex()+'\\)</p>';
  }).join('');
  steps.push({t:'Kontrola s podmínkami',h:chk||'<p>Není co kontrolovat.</p>'});
  const K=S.identity?'\\mathbb{R}\\setminus\\{'+S.conds.map(c=>c.tex()).join(';')+'\\}':S.valid.length?'\\{'+S.valid.map(r=>r.tex()).join(';\\ ')+'\\}':'\\emptyset';
  steps.push({t:'Výsledek',h:'\\[K='+K+'\\]'});
  const parts=[
    {id:'cond',kind:'list',stage:0,condMode:true,v,label:'1) Podmínky – které hodnoty \\('+v+'\\) jsou zakázané?',ans:S.conds,placeholder:'např. 0; 3'},
    {id:'roots',kind:'list',stage:1,v,label:'2) Řešení rovnice (jen kořeny, které vyhovují podmínkám):',ans:S.valid,excluded:S.conds,placeholder:'např. 2 (nemá-li řešení, napiš ∅)'}
  ];
  return {topic:'rovnice',diff,title:opts.title||'Lomená rovnice',
    statement:'<p>Řeš rovnici v \\(\\mathbb{R}\\):</p>\\['+eqTex(eq)+'\\]',
    parts,stageUnlock:{1:2},
    hints:['Nejdřív rozlož všechny jmenovatele na součin (vytýkání, rozdíl čtverců). Každý činitel ve jmenovateli dává jednu podmínku.',
      'Celou rovnici vynásob společným jmenovatelem \\('+S.lcdTex+'\\). Pak vyřeš vzniklou rovnici a <b>každý kořen porovnej s podmínkami</b>.'],
    steps,summary:'\\(K='+K+'\\)',printTask:'Urči podmínky a vyřeš rovnici.',data:{eq,S}};
}
function genRov(rng,diff=2){
  const T=(num,fac,show)=>({num,fac,show:show||'fac'});
  for(let t=0;t<5000;t++){
    let eq, kind;
    const r=rng.f();
    if(diff===1) kind=r<0.5?'A':'B';
    else if(diff===2) kind=r<0.35?'C':'F1';
    else kind=r<0.55?'F2':'F1';
    if(kind==='A'){ /* a/(x-p) = b/(x-q) */
      const p=rng.int(-5,5),q=rng.int(-5,5),a=rng.nz(-6,6),b=rng.nz(-6,6);
      if(p===q||a===b) continue;
      const x=fr(a*q-b*p,a-b); if(!x.isInt()||x.eq(p)||x.eq(q)||Math.abs(x.val())>9) continue;
      eq={v:'x',factors:[xp(p),xp(q)],L:[T([fr(a)],[0])],R:[T([fr(b)],[1])]};
    } else if(kind==='B'){ /* (x+α)/(x-p) = c */
      const p=rng.int(-5,5),al=rng.int(-6,6),c=rng.nz(-4,4); if(c===1||al===-p) continue;
      const x=fr(-c*p-al,1-c); if(!x.isInt()||x.eq(p)||Math.abs(x.val())>9) continue;
      eq={v:'x',factors:[xp(p)],L:[T(P.lin(1,al),[0])],R:[T([fr(c)],[])]};
    } else if(kind==='C'){ /* (x+α)/(x-p) = (x+β)/(x-q) */
      const p=rng.int(-5,5),q=rng.int(-5,5),al=rng.int(-6,6),be=rng.int(-6,6);
      if(p===q||al===-p||be===-q) continue;
      const den=al-q-be+p; if(den===0) continue;
      const x=fr(al*q-be*p,den); if(!x.isInt()||x.eq(p)||x.eq(q)||Math.abs(x.val())>9) continue;
      eq={v:'x',factors:[xp(p),xp(q)],L:[T(P.lin(1,al),[0])],R:[T(P.lin(1,be),[1])]};
    } else if(kind==='F1'){ /* (x+α)/(x-p) + β/((x-p)(x-q)) = γ/(x-q) */
      const p=rng.int(-5,5),q=rng.int(-5,5); if(p===q) continue;
      const r1=rng.int(-6,6); if(r1===p||r1===q) continue;
      const exclP=diff===3?0.5:0.3;
      const r2=rng.chance(exclP)?rng.pick([p,q]):rng.int(-6,6); if(r2===r1) continue;
      const g=rng.nz(-5,5);
      const al=q+g-(r1+r2), be=r1*r2+al*q-g*p;
      if(be===0||Math.abs(al)>9||Math.abs(be)>45||al===-p) continue;
      eq={v:'x',factors:[xp(p),xp(q)],L:[T(P.lin(1,al),[0]),T([fr(be)],[0,1],'exp')],R:[T([fr(g)],[1])]};
    } else { /* F2 – typ z písemky: (x+α)/(x-p) + β/(x²-px) = γ/(x-p) + δ */
      const p=rng.nz(-5,5); const de=rng.pick([fr(-3,2),fr(-1,2),fr(1,2),fr(3,2),fr(-1),fr(2),fr(-2),fr(3)]);
      const k=fr(1).sub(de);
      const r1=rng.nz(-6,6); if(r1===p) continue;
      const r2=rng.chance(0.55)?p:rng.nz(-6,6); if(r2===r1) continue;
      const g=rng.nz(-6,6);
      const al=fr(g).sub(de.mul(p)).sub(k.mul(r1+r2)), be=k.mul(r1*r2);
      if(!al.isInt()||!be.isInt()||be.isZero()||Math.abs(al.val())>9||Math.abs(be.val())>45||al.eq(-p)) continue;
      eq={v:'x',factors:[xp(p),X1],L:[T(P.lin(1,al),[0]),T([be],[1,0],'exp')],R:[T([fr(g)],[0]),T([de],[])]};
    }
    let pr; try{pr=buildRov(eq,diff);}catch(e){continue;}
    const S=pr.data.S;
    if(S.identity||!S.roots) continue;
    if(diff>=2&&S.deg===2&&!S.valid.length&&rng.chance(0.7)) continue;
    if(S.valid.some(x=>!x.isInt())&&diff<3) continue;
    return pr;
  }
  throw new Error('genRov');
}

const REL_TEX={'<':'\\lt ','<=':'\\le ','>':'\\gt ','>=':'\\ge '};
const REL_TXT={'<':'<','<=':'≤','>':'>','>=':'≥'};
function testPoint(pts,i){
  const k=pts.length; if(!k) return fr(0);
  if(i===0) return fr(Math.floor(pts[0].val())-1);
  if(i===k) return fr(Math.ceil(pts[k-1].val())+1);
  const a=pts[i-1],b=pts[i]; const c=fr(Math.floor(a.val())+1);
  return (c.gt(a)&&c.lt(b))?c:a.add(b).div(2);
}
function intervalLabel(pts,i){
  const k=pts.length;

function signTableHtml(I){

  const cD=P.norm(Den)[P.deg(Den)].div(dz.reduce((a,r)=>a.mul(r.d),fr(1)));
  const c=cN.div(cD);
  if(c.sign()<0) rows.push({lab:c.tex(),p:[c]});
  nz.forEach(r=>{const f=linFac(r,v);rows.push({lab:f.mono?f.t:f.t.slice(1,-1),p:f.p,num:true});});
  dz.forEach(r=>{const f=linFac(r,v);rows.push({lab:f.mono?f.t:f.t.slice(1,-1),p:f.p,den:true});});
  const sg=s=>s>0?'<td class="sp">+</td>':'<td class="sm">−</td>';
  let h='<div class="tscroll"><table class="signtab"><thead><tr><th></th>'+tests.map((_,i)=>'<th>\\('+intervalLabel(pts,i)+'\\)</th>').join('')+'</tr></thead><tbody>';
  h+='<tr class="tp"><td>test \\('+v+'\\)</td>'+tests.map(t=>'<td>\\('+t.tex()+'\\)</td>').join('')+'</tr>';
  for(const r of rows) h+='<tr><td>\\('+r.lab+'\\)'+(r.den?' <small>(jmen.)</small>':'')+'</td>'+tests.map(t=>sg(P.ev(r.p,t).sign())).join('')+'</tr>';
  h+='<tr class="tot"><td>zlomek</td>'+I.signs.map(sg).join('')+'</tr></tbody></table></div>';

}
function buildIneq(d,diff=2,opts={}){
  const v=d.v||'x', rhs=F.of(d.rhs||0), rel=d.rel;
  const num=P.norm(d.num), den=P.norm(d.den);
  const N=rhs.isZero()?num:P.sub(num,P.scale(den,rhs));

  const nz=rationalRoots(N), dz=rationalRoots(den);
  if(nz===null||dz===null) throw new Error('irrational');
  if(nz.length!==Math.max(P.deg(N),0)||dz.length!==P.deg(den)||!dz.length) throw new Error('not simple');
  if(nz.some(a=>dz.some(b=>a.eq(b)))) throw new Error('shared');
  const pts=[...nz,...dz].sort((a,b)=>a.cmp(b)); const k=pts.length;
  const tests=[]; for(let i=0;i<=k;i++) tests.push(testPoint(pts,i));
  const signs=tests.map(t=>P.ev(N,t).div(P.ev(den,t)).sign());
  const pos=rel==='>'||rel==='>=', nonstrict=rel==='<='||rel==='>=';

  const inclP=pts.map((p,i)=>!isDen[i]&&nonstrict);

  const I={pts,tests,nz,dz,N,Den:den,v,signs,inclI,inclP,isDen,segs,rel};
  const steps=[];
  if(rhs.isZero()) steps.push({t:'Vše na jednu stranu',h:'<p>Na pravé straně už je 0, můžeme rovnou rozkládat.</p>'});
  else{
    const c=rhs.neg(); const mulT=(c.eq(1)?'':c.eq(-1)?'-':c.tex())+'('+P.tex(den,v)+')';
    steps.push({t:'Vše na jednu stranu a na jeden zlomek',h:'<div class="warnbox">Nenásob jmenovatelem! Nevíme, jestli je kladný, nebo záporný – znaménko nerovnosti by se mohlo otočit.</div>'+
      '\\[\\frac{'+numT+'}{'+denT+'}'+(c.sign()>0?' + '+c.tex():' - '+c.abs().tex())+'\\;'+REL_TEX[rel]+'\\;0\\]'+
      '\\[\\frac{'+joinTex([P.tex(num,v),mulT])+'}{'+P.tex(den,v)+'}\\;'+REL_TEX[rel]+'\\;0\\qquad\\Longrightarrow\\qquad\\frac{'+P.tex(N,v)+'}{'+P.tex(den,v)+'}\\;'+REL_TEX[rel]+'\\;0\\]'});
  }
  steps.push({t:'Rozklad na součin',h:'\\[\\frac{'+factorTex(N,v)+'}{'+factorTex(den,v)+'}\\;'+REL_TEX[rel]+'\\;0\\]'});
  steps.push({t:'Nulové body',h:'<p>Čitatel: '+(nz.length?'\\('+nz.map(r=>v+'='+r.tex()).join(',\\ ')+'\\)':'je konstanta, nulový bod nemá')+'.</p><div class="cond">Jmenovatel: \\('+dz.map(r=>v+'='+r.tex()).join(',\\ ')+'\\) – tyto body do výsledku nikdy nepatří (dělení nulou).</div>'});
  steps.push({t:'Znaménková tabulka',h:signTableHtml(I)+numberLineSVG(pts,signs,inclI,inclP,isDen)});
  steps.push({t:'Výběr intervalů',h:'<p>Hledáme, kde je zlomek '+(pos?'kladný':'záporný')+(nonstrict?' nebo roven nule. Nulové body čitatele proto patří do výsledku (uzavřená závorka), body jmenovatele ne.':'. Nerovnost je ostrá, krajní body nepatří.')+'</p>'});
  steps.push({t:'Výsledek',h:'\\[K='+segsTex(segs)+'\\]'});
  const parts=[
    {id:'nz',kind:'list',stage:0,v,label:'Nulové body čitatele (po převedení na tvar „zlomek '+REL_TXT[rel]+' 0“):',ans:nz,placeholder:'např. 0; 3 (nemá-li, napiš ∅)'},
    {id:'dz',kind:'list',stage:0,v,label:'Nulové body jmenovatele:',ans:dz,placeholder:'např. -4; 4'},
    {id:'signs',kind:'signs',stage:1,label:'Znaménková tabulka – klikni na znaménko zlomku v každém intervalu:',I},
    {id:'pick',kind:'pick',stage:2,label:'Vyber, co patří do výsledku:',I}

  const examParts=[parts[0],parts[1],{id:'int',kind:'interval',v,label:'Výsledek (intervaly):',ans:segs,placeholder:'např. (-4;0>∪<3;4)'}];
  return {topic:'nerovnice',diff,title:opts.title||'Lomená nerovnice',
    statement:'<p>Řeš nerovnici v \\(\\mathbb{R}\\):</p>\\[\\frac{'+numT+'}{'+denT+'}\\;'+REL_TEX[rel]+'\\;'+rhs.tex()+'\\]',
    parts,examParts,stageUnlock:{1:3,2:4},
    hints:[rhs.isZero()?'Pravá strana je 0. Rozlož čitatel i jmenovatel na součin a najdi jejich nulové body.':'Nenásob jmenovatelem! Odečti '+pT(rhs)+' a převeď vše na jeden zlomek. Pak najdi nulové body čitatele a jmenovatele.',
      'Kritické body rozdělí osu na '+(k+1)+' intervaly. V každém dosaď testovací číslo a urči znaménko. Body jmenovatele nikdy nepatří do výsledku'+(nonstrict?', body čitatele ano (nerovnost je neostrá).':'.')],
    steps,summary:'\\(K='+segsTex(segs)+'\\)',printTask:'Řeš nerovnici, výsledek zapiš intervalem.',data:I};
}
function checkSigns(part,arr){
  const I=part.I; const wrong=[];
  I.signs.forEach((s,i)=>{if(arr[i]!==s) wrong.push(i);});
  if(!wrong.length) return {ok:true};
  const i=wrong[0];
  return {ok:false,wrong,msg:(arr.some(a=>!a)?'Vyplň znaménko ve všech intervalech. ':'')+'Znaménko nesedí na intervalu \\('+intervalLabel(I.pts,i)+'\\). Dosaď testovací číslo, např. \\('+I.v+'='+I.tests[i].tex()+'\\).'};
}
function checkPick(part,ch){
  const I=part.I, msgs=[], v=I.v, nonstrict=I.rel==='<='||I.rel==='>=';
  I.pts.forEach((p,i)=>{
    const c=!!ch.P[i];
    if(c&&I.isDen[i]) msgs.push('Pozor – \\('+v+'='+p.tex()+'\\) nemůže být součástí výsledku, protože pro \\('+v+'='+p.tex()+'\\) je jmenovatel roven nule.');
    else if(c&&!nonstrict) msgs.push('\\('+v+'='+p.tex()+'\\) do výsledku nepatří – nerovnost je ostrá (\\('+REL_TEX[I.rel]+'\\)) a v tomto bodě je zlomek roven nule.');
    else if(!c&&!I.isDen[i]&&nonstrict) msgs.push('\\('+v+'='+p.tex()+'\\) do výsledku patří – nerovnost je neostrá (\\('+REL_TEX[I.rel]+'\\)) a zlomek je tu roven nule.');
  });
  I.inclI.forEach((inc,i)=>{
    if(!!ch.I[i]!==inc) msgs.push('Na intervalu \\('+intervalLabel(I.pts,i)+'\\) je zlomek '+(I.signs[i]>0?'kladný':'záporný')+', takže do výsledku '+(inc?'patří':'nepatří')+'.');
  });
  return msgs.length?{ok:false,msg:msgs.slice(0,3).join('<br>')}:{ok:true};
}
function genIneq(rng,diff=2){
  for(let t=0;t<5000;t++){
    let d; const r=rng.f();
    const kind=diff===1?'N1':diff===2?(r<0.3?'N1':r<0.6?'N2':r<0.85?'N4':'N3'):(r<0.4?'N3':r<0.65?'N5':r<0.85?'N6':'N4');
    const rel=rng.pick(['<','<=','>','>=']);
    if(kind==='N1'){
      const a1=diff===1?rng.pick([1,-1]):rng.pick([1,-1,2,-2,3,-3]), b1=rng.int(-9,9), b2=rng.int(-6,6), a2=1;
      if(diff===1&&b1%a1!==0) continue;
      d={num:P.lin(a1,b1),den:P.lin(a2,b2),rhs:0,rel};
    } else if(kind==='N2'){
      const k=rng.nz(-6,6),p=rng.int(-5,5),m=rng.nz(-3,3);
      d={num:[fr(k)],den:xp(p),rhs:m,rel};
    } else if(kind==='N4'){
      const a=rng.int(-6,6),b=rng.int(-6,6),m=rng.pick([1,1,2,-1,-2,3]); if(a===b) continue;
      d={num:P.lin(1,a),den:P.lin(1,b),rhs:m,rel};
    } else if(kind==='N3'){
      const u1=rng.int(-5,5),u2=rng.int(-5,5),w1=rng.int(-6,6),w2=rng.int(-6,6);
      if(new Set([u1,u2,w1,w2]).size<4) continue;
      const s=rng.chance(0.25)?-1:1;
      d={num:P.scale(P.mul(xp(u1),xp(u2)),s),den:P.mul(xp(w1),xp(w2)),rhs:0,rel};
    } else if(kind==='N5'){
      const u1=rng.int(-5,5),u2=rng.int(-5,5),w=rng.int(-5,5); if(new Set([u1,u2,w]).size<3) continue;
      d={num:P.mul(xp(u1),xp(u2)),den:xp(w),rhs:0,rel};
    } else {
      const u=rng.int(-5,5),w=rng.int(1,5); if(Math.abs(u)===w) continue;
      d={num:xp(u),den:P.mul(xp(w),xp(-w)),rhs:0,rel};
    }
    let pr; try{pr=buildIneq(d,diff);}catch(e){continue;}
    if(pr.data.pts.some(p=>Math.abs(p.val())>9)) continue;
    if(diff<=2&&pr.data.pts.some(p=>!p.isInt())&&rng.chance(diff===1?1:0.5)) continue;
    if(!pr.data.segs.length) continue;
    return pr;
  }
  throw new Error('genIneq');
}

function explainFactor(p,v){
  p=P.norm(p); const dg=P.deg(p);
  if(dg<2) return '';
  if(p[0].isZero()) return 'vytkneme \\('+v+'\\)';
  if(p[1].isZero()&&p[0].sign()<0&&p[2].eq(1)) return 'rozdíl čtverců \\(a^2-b^2=(a-b)(a+b)\\)';
  return 'trojčlen: hledáme dvě čísla se součinem \\('+p[0].div(p[2]).tex()+'\\) a součtem \\('+p[1].div(p[2]).tex()+'\\)';
}
function buildExpr(s,diff){

  ];

  if(s.extra){
    const K=s.extra.K; const eqP=P.sub(s.res.num,P.scale(s.res.den,K));

    steps.push({t:'Kdy má výraz hodnotu '+K.tex()+'?',h:'\\['+resTex+' = '+K.tex()+'\\]\\['+P.tex(eqP,v)+' = 0\\]'+

      '<p>Odpověď: \\('+(valid.length?valid.map(r=>v+'='+r.tex()).join(',\\ '):'\\text{žádné}\\ '+v)+'\\)</p>'});

        {t:'Krácení',h:'<p>Zkrátíme \\(('+P.tex(xp(a),v)+')\\), \\(('+P.tex(xp(-a),v)+')\\) a \\(('+P.tex(xp(-b),v)+')\\):</p>\\[='+kT+'\\frac{'+P.tex(xp(-c),v)+'}{'+v+'}\\]'}

function genExpr(rng,diff=2){
  for(let t=0;t<200;t++){
    let s; const r=rng.f();
    if(diff===1) s=genExprE1(rng,1);
    else if(diff===2) s=r<0.4?genExprE1(rng,2):r<0.75?genExprE2(rng,2):genExprE3(rng,2);
    else{
      const base=r<0.35?genExprE2(rng,3,'a'):r<0.6?genExprE1(rng,3,'a'):genExprE3(rng,3,'a');
      if(base.res.den.length===2&&P.deg(base.res.den)===1){
        const Ks=[]; for(let K=-6;K<=6;K++){const e=P.sub(base.res.num,P.scale(base.res.den,K));const rr=rationalRoots(e);if(rr&&rr.length===1&&rr[0].isInt()&&Math.abs(rr[0].val())<=9) Ks.push({K,r:rr[0]});}
        if(!Ks.length) continue;
        const exc=Ks.filter(o=>base.conds.some(c=>c.eq(o.r)));
        const pick=(exc.length&&rng.chance(0.35))?rng.pick(exc):rng.pick(Ks);
        base.extra={K:fr(pick.K)}; base.title='Výraz s parametrem a';
        base.task='Urči podmínky, zjednoduš výraz a urči, pro které \\(a\\) má výraz hodnotu \\('+pick.K+'\\):';
        base.printTask='Urči podmínky, zjednoduš výraz a urči, pro které a má hodnotu '+pick.K+'.';
      }
      s=base;
    }
    if(s) return buildExpr(s,diff);
  }
  throw new Error('genExpr');
}

function linTexAB(a,b,v='x'){a=F.of(a);b=F.of(b);return joinTex([a.isZero()?'':coefTex(a)+v,(b.isZero()&&!a.isZero())?'':b.tex()]);}
function ptTex(x,y){return '['+F.of(x).tex()+';\\ '+F.of(y).tex()+']';}
const flipRel={'<':'>','<=':'>=','>':'<','>=':'<='};

/* ---------- lineární funkce ---------- */
function buildLin(K,L,o={}){

    {t:'Dosazení hodnoty',h:'\\[f('+x3.tex()+')='+coefMulTex(a)+pT(x3)+(b.sign()<0?'':'+')+b.tex()+'='+f(x3).tex()+'\\]'},

function genLin(rng,diff=2){
  const As={1:[1,-1,2,-2,3,-3],2:[1,-1,2,-2,3,-3,fr(1,2),fr(-1,2),fr(3,2),fr(-3,2)],3:[fr(1,2),fr(-1,2),fr(3,2),fr(-3,2),fr(2,3),fr(-2,3),fr(1,3),fr(-1,3),fr(3,4),fr(-3,4)]}[diff];
  for(let t=0;t<3000;t++){
    const a=F.of(rng.pick(As)), b=rng.int(-6,6), q=a.d;
    const xs=[]; for(let x=-8;x<=8;x++) if(x%q===0) xs.push(x);
    const x1=rng.pick(xs), x2=rng.pick(xs); if(x1===x2) continue;
    const y1=a.mul(x1).add(b), y2=a.mul(x2).add(b);
    if(Math.abs(y1.val())>15||Math.abs(y2.val())>15) continue;
    if(diff===3&&b%q===0&&rng.chance(0.6)) continue;
    const x3=rng.pick(xs.filter(x=>x!==x1&&x!==x2&&Math.abs(x)<=6));
    const x0r=rng.pick(xs.filter(x=>Math.abs(x)<=6)); const k=a.mul(x0r).add(b); if(!k.isInt()||Math.abs(k.val())>12) continue;
    return buildLin([x1,y1],[x2,y2],{k,rel:rng.pick(['>','<','>=','<=']),x3,diff});
  }
  throw new Error('genLin');
}

/* ---------- kvadratická funkce ---------- */
function vfTex(A,m,n,v='x'){

  const sq=m.isZero()?v+'^2':'('+v+(m.sign()>0?' - ':' + ')+m.abs().tex()+')^2';
  return coefTex(A)+sq+(n.isZero()?'':(n.sign()>0?' + ':' - ')+n.abs().tex());
}
function buildQuad(a,b,c,o={}){
  const A=F.of(a),B=F.of(b),C=F.of(c), p=[C,B,A];
  const m=B.neg().div(A.mul(2)), n=P.ev(p,m);

    {id:'osa',kind:'num',label:'Osa souměrnosti \\(x=\\)',ans:m},
    {id:'D',kind:'num',label:'Diskriminant \\(D=\\)',ans:qi.D,wrong:()=>'\\(D=b^2-4ac\\). Pozor na znaménka a na \\(b^2\\) – je vždy nezáporné.'},

    {id:'mono',kind:'choice',label:'Monotonie:',options:[{v:'kr',l:'nejdřív klesá, od vrcholu roste'},{v:'rk',l:'nejdřív roste, od vrcholu klesá'}],ans:up?'kr':'rk',wrong:()=>'Rozhoduje znaménko a: a > 0 → parabola otevřená nahoru.'}
  ];
  let compl;

  else compl='\\[f(x)='+fT+'='+A.tex()+'\\left('+P.tex([fr(0),B.div(A),fr(1)])+'\\right)'+(C.isZero()?'':(C.sign()>0?' + ':' - ')+C.abs().tex())+'='+A.tex()+'\\left['+vfTex(1,m,0)+(m2.isZero()?'':' - '+m2.tex())+'\\right]'+(C.isZero()?'':(C.sign()>0?' + ':' - ')+C.abs().tex())+'='+vfTex(A,m,n)+'\\]';
  const prodT=roots.length?'<p>Součinový tvar: \\(f(x)='+factorTex(p)+'\\)</p>':'<p>Součinový tvar neexistuje (žádné reálné kořeny).</p>';
  const xsW=[m.val(),...roots.map(r=>r.val()),0], ysW=[n.val(),C.val()];
  const ws=autoWindow(xsW,ysW,8,10); ws.xr=[Math.min(ws.xr[0],Math.floor(m.val()-3)),Math.max(ws.xr[1],Math.ceil(m.val()+3))];
  const graph=plotSVG({...ws,fns:[{f:x=>P.evf(p,x),c:0}],vlines:[{x:m.val(),label:'x = '+m.str().replace('-','−')}],pts:[{x:m.val(),y:n.val(),label:'V'},{x:0,y:C.val(),label:'P<tspan baseline-shift="sub" font-size="9">y</tspan>',c:'alt'},...roots.map(r=>({x:r.val(),y:0,label:'',c:'alt'}))]});
  const steps=[
    {t:'Předpis',h:'\\[f(x)='+fT+',\\qquad a='+A.tex()+',\\ b='+B.tex()+',\\ c='+C.tex()+'\\]<p>\\(a'+(up?'>':'<')+'0\\) → parabola je otevřená '+(up?'nahoru (má minimum)':'dolů (má maximum)')+'.</p>'},
    {t:'Vrcholový tvar (doplnění na čtverec)',h:compl},
    {t:'Diskriminant',h:'\\[D=b^2-4ac='+pT(B)+'^2-4\\cdot '+pT(A)+'\\cdot '+pT(C)+'='+qi.D.tex()+'\\]<p>'+(qi.D.sign()>0?'D &gt; 0 → dva průsečíky s osou x.':qi.D.isZero()?'D = 0 → graf se osy x dotýká v jednom bodě.':'D &lt; 0 → graf osu x neprotíná.')+'</p>'},

    parts,hints:['Vrchol: \\(x_V=-\\frac{b}{2a}\\), \\(y_V=f(x_V)\\). Nebo doplň na čtverec: \\(a(x-m)^2+n\\) → \\(V=[m;n]\\).','\\(D=b^2-4ac\\). Průsečík s osou y je vždy \\([0;c]\\). Je-li a > 0, je \\(H(f)=\\langle y_V;\\infty)\\).'],
    steps,summary:'\\(f(x)='+vfTex(A,m,n)+'\\), \\(V='+ptTex(m,n)+'\\), \\(D='+qi.D.tex()+'\\), \\(H(f)='+(up?'\\langle '+n.tex()+';\\infty)':'(-\\infty;'+n.tex()+'\\rangle')+'\\)',
    printTask:'Urči vrchol, osu, D, průsečíky s osami, H(f), monotonii a načrtni graf.',data:{A,B,C,m,n,roots,D:qi.D}};
}
function genQuad(rng,diff=2){
  const As={1:[1,-1],2:[1,1,-1,2,-2],3:[2,-2,3,-3,1,-1]}[diff];
  for(let t=0;t<3000;t++){
    const a=rng.pick(As), m=rng.int(-4,4), r=rng.f();

/* ---------- průsečíky dvou funkcí ---------- */
function buildInter(f,g,o={}){
  f=P.norm(f);g=P.norm(g);
  const d=P.sub(f,g); const roots=rationalRoots(d);

  let solve;
  if(P.deg(dn)===2){
    if(dn[0].isZero()) solve='\\['+factorTex(dn)+'=0\\;\\Rightarrow\\;'+roots.map(r=>'x='+r.tex()).join('\\ \\text{nebo}\\ ')+'\\]';
    else solve=quadSolveTex(dn,'x');
  } else solve='\\[x='+(roots[0]?roots[0].tex():'')+'\\]';
  const xs=[...roots.map(r=>r.val()),0], ys=[...pts.map(p=>p[1].val()),P.evf(f,0)];
  const mF=P.norm(f)[1]?fr(0).sub(P.norm(f)[1]).div(P.norm(f)[2].mul(2)):fr(0); xs.push(mF.val()); ys.push(P.evf(f,mF.val()));
  const ws=autoWindow(xs,ys,8,10);
  const graph=plotSVG({...ws,fns:[{f:x=>P.evf(f,x),c:0,label:'f'},{f:x=>P.evf(g,x),c:1,label:'g'}],pts:pts.map((p,i)=>({x:p[0].val(),y:p[1].val(),label:'P'+(i+1)}))});
  const steps=[
    {t:'Položíme f(x) = g(x)',h:'\\['+P.tex(f)+' = '+P.tex(g)+'\\]'},
    {t:'Převedeme na jednu stranu',h:'\\['+P.tex(dn)+' = 0\\]'+(lead.eq(1)?'':'<p>Vydělíme \\('+pT(lead)+'\\): \\('+P.tex(dd)+'=0\\)</p>')},
    {t:'Vyřešíme',h:solve},
    {t:'Dopočítáme y (dosadíme do g)',h:pts.length?pts.map(p=>'\\[x='+p[0].tex()+':\\quad y=g('+p[0].tex()+')='+p[1].tex()+'\\]').join(''):'<p>Žádné x – grafy se neprotínají.</p>'},
    {t:'Výsledek',h:pts.length?'\\['+pts.map((p,i)=>'P_'+(i+1)+'='+ptTex(p[0],p[1])).join(',\\quad ')+'\\]':'<p>Grafy nemají společný bod.</p>'},
    {t:'Graf',h:graph}
  ];
  return {topic:'prusecik',diff:o.diff||2,title:'Průsečíky dvou funkcí',
    statement:'<p>Najdi průsečíky grafů funkcí</p>\\[f(x)='+P.tex(f)+',\\qquad g(x)='+P.tex(g)+'\\]',
    parts:[{id:'P',kind:'points',label:'Průsečíky – zapiš celé body [x;y]:',ans:pts,placeholder:'[0;3]; [4;11]   (žádné → ∅)'}],
    hints:['Průsečík = bod, který leží na obou grafech. Polož \\(f(x)=g(x)\\) a vyřeš vzniklou kvadratickou rovnici.','Ke každému x dopočítej y dosazením do g (nebo f) a zapiš celý bod \\([x;y]\\).'],
    steps,summary:pts.length?'\\('+pts.map(p=>ptTex(p[0],p[1])).join(',\\ ')+'\\)':'žádné průsečíky',printTask:'Najdi průsečíky grafů (celé body [x;y]).',data:{pts}};
}
function genInter(rng,diff=2){
  for(let t=0;t<3000;t++){
    const a=diff===3?rng.pick([1,-1,2]):rng.pick([1,-1]), b=rng.int(-4,4), c=rng.int(-5,5);
    const f=[fr(c),fr(b),fr(a)]; const r=rng.f(); let g;
    if(r<0.72){const x1=rng.int(-4,5),x2=rng.int(-4,5);if(x1===x2) continue;g=[fr(c-a*x1*x2),fr(b+a*(x1+x2))];}
    else if(r<0.86){const x1=rng.int(-3,4);g=[fr(c-a*x1*x1),fr(b+2*a*x1)];}
    else{const m=rng.int(-3,3),q=rng.int(1,3);g=[fr(c-a*m*m-a*q),fr(b+2*a*m)];}
    if(Math.abs(g[0].val())>15||Math.abs(g[1].val())>8) continue;
    let pr; try{pr=buildInter(f,g,{diff});}catch(e){continue;}
    if(pr.data.pts.some(p=>Math.abs(p[1].val())>40)) continue;
    return pr;
  }
  throw new Error('genInter');
}

    {t:'Koeficient a',h:'\\[a=\\frac{'+fd(y2)+'-'+decP(y1)+'}{'+fd(x2)+'-'+decP(x1)+'}=\\frac{'+fd(y2.sub(y1))+'}{'+fd(x2.sub(x1))+'}='+fd(a)+'\\]<p>a = '+tpl.am+'.</p>'},

  ];
  return {topic:'slovni',diff,title:'Slovní úloha – lineární funkce',statement:'<p>'+tpl.text(D)+'</p><p>Urči předpis \\('+Y+'=a\\cdot '+X+'+b\\) a odpověz na otázky.</p>',
