<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Příprava na opravnou zkoušku z matematiky</title>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#16263d;          /* hlavní tmavě modrá – inkoust */
  --ink-soft:#33476a;
  --paper:#f7f5ef;        /* papírová */
  --paper-card:#fffdf8;
  --line:#e4ddcd;
  --line-strong:#cdc3ac;
  --amber:#e07a1f;        /* akcent – pozor na chyby */
  --amber-soft:#fbe6cf;
  --amber-line:#f1c98a;
  --green:#2f8f5b;        /* hotovo */
  --green-soft:#e3f1e7;
  --red:#c0392b;          /* chyby */
  --red-soft:#f9e4e1;
  --blue-soft:#e7eef7;
  --shadow:0 1px 2px rgba(22,38,61,.06),0 4px 16px rgba(22,38,61,.07);
  --shadow-lg:0 8px 40px rgba(22,38,61,.14);
  --radius:14px;
  --maxw:1080px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;line-height:1.2;font-weight:600}
code,.mono{font-family:'JetBrains Mono',monospace}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- HEADER ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(247,245,239,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.topbar .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:9px}
.topbar .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--amber);display:inline-block;transform:rotate(45deg)}
.topbar nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.topbar nav a{
  font-size:.82rem;color:var(--ink-soft);text-decoration:none;
  padding:6px 11px;border-radius:8px;font-weight:500;white-space:nowrap;
}
.topbar nav a:hover{background:var(--blue-soft);color:var(--ink)}
.mini-progress{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--ink-soft)}
.mini-track{width:84px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-fill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#f0a04b);border-radius:99px;transition:width .5s ease}

/* ---------- HERO ---------- */
.hero{
  background:
    radial-gradient(1200px 400px at 80% -10%, rgba(224,122,31,.10), transparent 60%),
    linear-gradient(180deg,#fbf9f3,var(--paper));
  border-bottom:1px solid var(--line);
  position:relative;overflow:hidden;
}
.hero::before{
  /* jemný papírový rastr / čtverečkovaný sešit */
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;opacity:.35;mask-image:radial-gradient(900px 360px at 75% 0%,#000,transparent 70%);
}
.hero-inner{max-width:var(--maxw);margin:0 auto;padding:64px 20px 52px;position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);
  padding:6px 12px;border-radius:99px;margin-bottom:22px;
}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.5rem);font-weight:700;letter-spacing:-.01em;max-width:16ch}
.hero .sub{font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--ink-soft);margin-top:16px;max-width:54ch}
.hero .deadline{
  margin-top:28px;display:flex;gap:14px;flex-wrap:wrap;
}
.countdown{
  background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px 22px;display:flex;gap:20px;align-items:center;box-shadow:var(--shadow-lg)
}
.countdown .big{font-family:'Fraunces',serif;font-size:2.2rem;font-weight:700;line-height:1}
.countdown .lbl{font-size:.78rem;color:#b9c6da;letter-spacing:.04em}
.countdown .date{border-left:1px solid #38496310;padding-left:20px;border-color:#3a4d6e}

/* ---------- SYSTEM STRIP ---------- */
.system{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:34px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper-card)}
.system .step{padding:16px 18px;border-right:1px solid var(--line);position:relative}
.system .step:last-child{border-right:none}
.system .step .n{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--amber);font-weight:700}
.system .step p{font-size:.86rem;margin-top:6px;color:var(--ink-soft);line-height:1.45}

/* ---------- SECTION ---------- */
section{padding:46px 0}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.section-head .idx{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--amber);font-weight:700;padding-top:4px}
.section-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.section-intro{color:var(--ink-soft);max-width:62ch;margin-bottom:26px}

/* ---------- DASHBOARD ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{font-family:'Fraunces',serif;font-size:2.3rem;font-weight:700;margin-top:4px;line-height:1}
.stat .v small{font-size:1rem;color:var(--ink-soft);font-weight:500}
.stat.accent{background:linear-gradient(160deg,#fff,var(--amber-soft));border-color:var(--amber-line)}
.dash-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.bigbar-card{background:var(--ink);color:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-lg)}
.bigbar-card .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.bigbar-card .top .now{font-family:'Fraunces',serif;font-size:2.6rem;font-weight:700;line-height:1}
.bigbar-card .top .meta{text-align:right;font-size:.82rem;color:#b9c6da}
.bigbar-card .meta b{color:#fff;font-weight:600;display:block;font-size:.95rem}
.bigtrack{height:12px;border-radius:99px;background:#2a3c59;overflow:hidden}
.bigfill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#f3ab5a);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bigbar-card .legend{display:flex;gap:16px;margin-top:14px;font-size:.78rem;color:#b9c6da;flex-wrap:wrap}
.watch{
  background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:var(--radius);padding:20px;
}
.watch h4{color:#9a4e0c;display:flex;align-items:center;gap:8px;font-size:1.05rem;margin-bottom:10px}
.watch ul{list-style:none;font-size:.88rem}
.watch li{padding:5px 0 5px 22px;position:relative;color:#7a431a;line-height:1.4}
.watch li::before{content:"!";position:absolute;left:0;top:5px;width:15px;height:15px;background:var(--amber);color:#fff;border-radius:4px;font-size:.7rem;font-weight:700;display:grid;place-items:center;font-family:'JetBrains Mono',monospace}

/* ---------- GUIDE CARDS (žák/rodič) ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.guide{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.guide.parent{background:linear-gradient(170deg,#fff,var(--green-soft));border-color:#bfe0c9}
.guide h3{font-size:1.25rem;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.guide .tag{font-size:.7rem;font-family:'JetBrains Mono',monospace;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:var(--ink-soft)}
.guide.parent .tag{background:#cdead6;color:#1f6b3f}
.guide ul{list-style:none}
.guide li{padding:8px 0 8px 30px;position:relative;border-bottom:1px dashed var(--line);font-size:.92rem}
.guide li:last-child{border-bottom:none}
.guide li::before{content:"";position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:2px;background:var(--amber);transform:rotate(45deg)}
.guide.parent li::before{background:var(--green)}

/* ---------- WEEK ACCORDION ---------- */
.weeks{display:flex;flex-direction:column;gap:14px}
.week{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:80px;
  transition:border-color .2s, box-shadow .2s;
}
.week.is-open{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
.week.is-done{border-color:#bfe0c9}
.week-head{
  display:flex;align-items:center;gap:18px;padding:18px 22px;cursor:pointer;user-select:none;
  width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit
}
.week-head:hover{background:#fbfaf6}
.week-num{
  flex:none;width:50px;height:50px;border-radius:12px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;position:relative
}
.week.is-done .week-num{background:var(--green)}
.week-head .info{flex:1;min-width:0}
.week-head .dates{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--amber);font-weight:700;letter-spacing:.03em}
.week-head .title{font-family:'Fraunces',serif;font-weight:600;font-size:1.18rem;margin-top:1px}
.week-head .title .rep{font-size:.7rem;background:var(--red-soft);color:var(--red);padding:2px 8px;border-radius:6px;vertical-align:middle;margin-left:8px;font-family:'JetBrains Mono',monospace;font-weight:700}
.week-prog{flex:none;display:flex;align-items:center;gap:10px;width:160px}
.week-prog .wtrack{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.week-prog .wfill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#f0a04b);border-radius:99px;transition:width .5s}
.week.is-done .week-prog .wfill{background:linear-gradient(90deg,var(--green),#56b27e)}
.week-prog .wpct{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;width:38px;text-align:right;color:var(--ink-soft)}
.chev{flex:none;color:var(--line-strong);transition:transform .3s}
.week.is-open .chev{transform:rotate(180deg)}
@media (max-width:680px){.week-prog{display:none}}

.week-body{display:none;padding:0 22px 24px;border-top:1px solid var(--line)}
.week.is-open .week-body{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.goal-banner{
  background:var(--blue-soft);border-left:4px solid var(--ink);border-radius:8px;
  padding:12px 16px;margin:20px 0;font-size:.92rem
}
.goal-banner b{font-family:'Fraunces',serif}

.block-label{
  display:flex;align-items:center;gap:9px;margin:26px 0 12px;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)
}
.block-label .ic{width:22px;height:22px;border-radius:6px;background:var(--amber-soft);border:1px solid var(--amber-line);display:grid;place-items:center;color:var(--amber);font-size:.8rem}

.explain{font-size:.95rem;color:var(--ink-soft)}
.explain p{margin-bottom:10px}
.explain strong{color:var(--ink)}

/* postup krok za krokem */
.steps{counter-reset:st;list-style:none;margin:6px 0}
.steps li{counter-increment:st;position:relative;padding:8px 0 8px 40px;border-bottom:1px dashed var(--line);font-size:.92rem}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:26px;height:26px;background:var(--ink);color:#fff;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;display:grid;place-items:center}

/* řešený příklad */
.worked{background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.worked .wq{font-weight:600;margin-bottom:6px}
.worked .wtag{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;letter-spacing:.05em}

/* daný/samostatné příklady – grid */
.ex-list{list-style:none;counter-reset:ex;display:grid;gap:8px}
.ex-list li{
  counter-increment:ex;display:flex;gap:12px;align-items:flex-start;
  background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:.95rem
}
.ex-list li::before{content:counter(ex);flex:none;font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;margin-top:1px}
.ex-list li .qx{flex:1;min-width:0;overflow-x:auto}

/* tlačítko řešení */
.solve{margin-top:12px}
.solve-btn{
  background:var(--ink);color:#fff;border:none;border-radius:9px;padding:9px 16px;
  font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:background .2s
}
.solve-btn:hover{background:#0f1d30}
.solve-btn .ar{transition:transform .25s}
.solve-btn.open .ar{transform:rotate(90deg)}
.solution{
  display:none;margin-top:10px;background:var(--green-soft);border:1px solid #bfe0c9;border-radius:10px;padding:14px 16px;font-size:.92rem
}
.solution.open{display:block;animation:fade .25s ease}
.solution ol{margin-left:18px}
.solution li{margin:5px 0}
.solution .ans{margin-top:10px;padding:8px 12px;background:#fff;border-left:3px solid var(--green);border-radius:6px;font-weight:600}

/* checklist týdne */
.check-list{list-style:none;display:grid;gap:6px;margin-top:6px}
.check-item{display:flex;gap:11px;align-items:flex-start;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;transition:background .15s;font-size:.93rem}
.check-item:hover{background:#f3f1ea}
.check-item input{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--line-strong);border-radius:7px;cursor:pointer;position:relative;margin-top:1px;transition:.15s;background:#fff}
.check-item input:checked{background:var(--green);border-color:var(--green)}
.check-item input:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check-item input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.check-item.done span{text-decoration:line-through;color:var(--ink-soft)}
.check-item .day{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--amber);flex:none;width:34px;padding-top:2px}

/* časté chyby */
.mistakes{background:var(--red-soft);border:1px solid #eebcb4;border-radius:12px;padding:16px 18px;margin-top:8px}
.mistakes h4{color:var(--red);font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mistakes ul{list-style:none;font-size:.9rem}
.mistakes li{padding:5px 0 5px 24px;position:relative;color:#8a2c20}
.mistakes li::before{content:"\00D7";position:absolute;left:4px;top:3px;color:var(--red);font-weight:700;font-size:1.1rem;line-height:1}

/* denní režim mini */
.regime{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 4px}
.regime .d{background:#fbfaf6;border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center}
.regime .d .dn{font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;color:var(--amber);text-transform:uppercase}
.regime .d .dt{font-size:.72rem;color:var(--ink-soft);margin-top:3px;line-height:1.25}
.regime .d.rest{background:var(--blue-soft);border-color:#c9d8ec}
@media (max-width:680px){.regime{grid-template-columns:repeat(2,1fr)}}

/* ---------- GENERIC CARD ---------- */
.card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}

/* chybník */
.notebook textarea{
  width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:14px;
  font:inherit;font-size:.92rem;background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 31px,var(--line) 32px);
  line-height:32px;resize:vertical;color:var(--ink)
}
.notebook textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber-line)}
.notebook .savebar{display:flex;align-items:center;gap:12px;margin-top:10px}
.btn-save{background:var(--amber);color:#fff;border:none;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;font-size:.84rem;cursor:pointer}
.btn-save:hover{background:#c96a14}
.saved-msg{font-size:.82rem;color:var(--green);font-weight:600;opacity:0;transition:opacity .3s}
.saved-msg.show{opacity:1}

/* send-list */
.send-list{list-style:none;display:grid;gap:8px;margin-top:6px}
.send-list li{display:flex;gap:11px;align-items:center;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:.93rem}
.send-list li .pin{flex:none;width:26px;height:26px;border-radius:8px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);display:grid;place-items:center;font-size:.8rem;font-family:'JetBrains Mono',monospace;font-weight:700}

/* reset button */
.reset-bar{text-align:center;padding:30px 0 10px}
.btn-reset{background:none;border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:9px;padding:9px 18px;font:inherit;font-size:.82rem;cursor:pointer}
.btn-reset:hover{border-color:var(--red);color:var(--red)}

/* footer */
footer{border-top:1px solid var(--line);padding:30px 0 50px;text-align:center;color:var(--ink-soft);font-size:.85rem}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .dash-bottom{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .system{grid-template-columns:1fr 1fr}
  .system .step:nth-child(odd){border-right:1px solid var(--line)}
}
@media (max-width:560px){
  .dash-grid{grid-template-columns:1fr 1fr}
  .system{grid-template-columns:1fr}
  .system .step{border-right:none;border-bottom:1px solid var(--line)}
  .countdown{flex-direction:column;align-items:flex-start;gap:10px}
  .countdown .date{border-left:none;padding-left:0;border-top:1px solid #3a4d6e;padding-top:10px}
  .hero-inner{padding:44px 20px 38px}
  .week-head{gap:12px;padding:15px 16px}
  .week-body{padding:0 16px 20px}
}

/* ---------- PRINT ---------- */
@media print{
  .topbar,.hero::before,.reset-bar,.solve-btn,.chev,.mini-progress,.notebook .savebar{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .hero{background:#fff;border:none}
  .week-body{display:block!important}
  .solution{display:block!important;background:#fff;border:1px solid #999}
  .week,.card,.stat,.guide,.worked,.ex-list li,.check-item{box-shadow:none;break-inside:avoid}
  .week{border:1px solid #999;margin-bottom:10px}
  section{padding:14px 0;break-inside:avoid}
  .chev,.week-prog{display:none}
  a{color:#000;text-decoration:none}
  .hero h1{font-size:22pt}
  .solve{margin-top:6px}
}
</style>
</head>
<body>

<div id="app"></div>
<script>
/* =========================================================
   DATA — vše v jedné struktuře, snadno upravitelné
   Každý týden: id, dates, theme, badge(rep?), intro, goal,
   steps[], worked[], practice[], minitest[], checklist[], mistakes[]
   regime je společný (denní režim) – stejný pro všechny týdny
   ========================================================= */

const REGIME = [
  {d:"Po", t:"Doučování – nové téma"},
  {d:"Út", t:"Samostatné příklady"},

        <li>Podmínka: \\(x - 1 \\neq 0 \\Rightarrow x \\neq 1\\).</li>
        <li>Rozložíme čitatel: \\(x^2 - x - 6 = (x-3)(x+2)\\). Nerovnice je \\(\\dfrac{(x-3)(x+2)}{x-1} \\le 0\\).</li>
        <li>Nulové body (čitatel i jmenovatel): \\(x = -2,\\ 1,\\ 3\\). Rozdělí osu na 4 intervaly.</li>
        <li>Znaménka zlomku (dosaď testovací číslo do každého úseku): \\(-\\) na \\((-\\infty;-2)\\), \\(+\\) na \\((-2;1)\\), \\(-\\) na \\((1;3)\\), \\(+\\) na \\((3;\\infty)\\).</li>
        <li>Hledáme \\(\\le 0\\): záporné úseky. Body \\(-2\\) a \\(3\\) patří (čitatel =0 povoleno), bod \\(1\\) <strong>ne</strong> (jmenovatel).</li>
      </ol>
      <div class="ans">\\(x \\in (-\\infty;\\,-2\\rangle \\cup (1;\\,3\\rangle\\)</div>`},
    {tag:"Iracionální rovnice", q:`\\(\\sqrt{x-1} + x = 3\\)`, sol:`
      <ol>
        <li>Podmínka: \\(x - 1 \\ge 0 \\Rightarrow x \\ge 1\\).</li>
        <li>Osamostatníme odmocninu: \\(\\sqrt{x-1} = 3 - x\\) (nutně \\(3-x \\ge 0\\)).</li>
        <li>Umocníme: \\(x - 1 = (3-x)^2 = 9 - 6x + x^2\\)</li>
        <li>\\(x^2 - 7x + 10 = 0 \\Rightarrow (x-2)(x-5)=0 \\Rightarrow x=2\\) nebo \\(x=5\\)</li>
        <li><strong>Zkouška:</strong> \\(x=2\\): \\(\\sqrt1 + 2 = 3\\) ✓. \\(x=5\\): \\(\\sqrt4 + 5 = 7 \\neq 3\\) ✗.</li>
      </ol>
      <div class="ans">\\(x = 2\\) (kořen \\(x=5\\) je falešný)</div>`},
    {tag:"Iracionální rovnice se dvěma odmocninami", q:`\\(\\sqrt{x+7} - \\sqrt{x} = 1\\)`, sol:`
      <ol>
        <li>Podmínky: \\(x+7\\ge0\\) a \\(x\\ge0\\) → dohromady \\(x \\ge 0\\).</li>
        <li>Osamostatníme jednu odmocninu: \\(\\sqrt{x+7} = 1 + \\sqrt{x}\\).</li>
        <li>Umocníme: \\(x+7 = 1 + 2\\sqrt{x} + x\\)</li>
        <li>\\(6 = 2\\sqrt{x} \\Rightarrow \\sqrt{x} = 3\\)</li>
        <li>Umocníme znovu: \\(x = 9\\).</li>
        <li><strong>Zkouška:</strong> \\(\\sqrt{16} - \\sqrt{9} = 4 - 3 = 1\\) ✓</li>
      </ol>
      <div class="ans">\\(x = 9\\)</div>`},
    {tag:"Iracionální rovnice – cesta bez zkoušky", q:`\\(\\sqrt{x-1} = x - 3\\) (řešení přes podmínku, ne zkouškou)`, sol:`
      <ol>
        <li>Odmocnina je vždy \\(\\ge 0\\), takže <strong>pravá strana musí být taky</strong> \\(\\ge 0\\): \\(x - 3 \\ge 0 \\Rightarrow x \\ge 3\\).</li>
        <li>(Podmínka výrazu pod odmocninou \\(x-1\\ge0\\) je slabší, splní se sama.)</li>
        <li>Za podmínky \\(x \\ge 3\\) je umocnění <strong>ekvivalentní úprava</strong>: \\(x - 1 = (x-3)^2\\)</li>
        <li>\\(x - 1 = x^2 - 6x + 9 \\Rightarrow x^2 - 7x + 10 = 0 \\Rightarrow (x-2)(x-5) = 0\\)</li>

      </ol>
      <div class="ans">\\(x = 5\\). Pozn.: tahle cesta nahrazuje zkoušku — falešný kořen padá na podmínce \\(x \\ge 3\\).</div>`}
  ],

    Nulové body: čitatel \\(x=-7\\), jmenovatel \\(x=-3\\). Znaménka zlomku \\(\\dfrac{-x-7}{x+3}\\): \\(-\\) / \\(+\\) / \\(-\\). Hledáme \\(\\ge0\\) → prostřední; \\(-7\\) patří, \\(-3\\) ne.`, ans:`\\(x \\in \\langle-7;\\,-3)\\)`},
  {n:10, label:"Slovní úloha", q:`2 kg prvního a 3 kg druhého zboží stojí 540 Kč; 3 kg prvního a 2,5 kg druhého stojí 640 Kč. Urči cenu 1 kg každého druhu.`,
    sol:`\\(2x+3y=540\\), \\(3x+2{,}5y=640\\). První ×3, druhou ×2: \\(6x+9y=1620\\), \\(6x+5y=1280\\). Odečteme: \\(4y=340 \\Rightarrow y=85\\); pak \\(2x+255=540 \\Rightarrow x=142{,}5\\).`, ans:`1 kg prvního 142,50 Kč, 1 kg druhého 85 Kč.`},
  {n:11, label:"Lineární funkce", q:`Urči rovnici přímky procházející body \\(A[-1;-3]\\), \\(B[2;5]\\) a její průsečík s osou \\(y\\).`,
    sol:`\\(y=ax+b\\): \\(-3=-a+b\\), \\(5=2a+b\\). Odečteme: \\(8=3a \\Rightarrow a=\\tfrac83\\); \\(b=-\\tfrac13\\). Průsečík s osou \\(y\\) je \\([0;b]\\).`, ans:`\\(y=\\tfrac83 x - \\tfrac13\\); průsečík \\([0;-\\tfrac13]\\)`},
  {n:12, label:"Kvadratická funkce", q:`\\(f: y = x^2 - 2x - 3\\). Urči vrchol, průsečíky s osami a načrtni graf.`,
    sol:`Vrcholový tvar \\(y=(x-1)^2-4\\) → vrchol \\([1;-4]\\). Průsečíky s osou \\(x\\): \\((x-3)(x+1)=0 \\Rightarrow [-1;0],[3;0]\\). S osou \\(y\\): \\([0;-3]\\). Parabola nahoru.`, ans:`Vrchol \\([1;-4]\\); průsečíky \\([-1;0],[3;0],[0;-3]\\)`},
  {n:13, label:"Definiční obor funkce", q:`Urči definiční obor \\(y = \\sqrt{\\dfrac{x+5}{x}}\\).`,
    sol:`Pod odmocninou musí být \\(\\ge0\\) a \\(x\\neq0\\). Řešíme \\(\\dfrac{x+5}{x}\\ge0\\): nulové body \\(-5,0\\), znaménka \\(+/-/+\\) → kladné na \\((-\\infty;-5\\rangle\\) a \\((0;\\infty)\\); \\(x=0\\) vyloučeno, \\(x=-5\\) povoleno (zlomek =0).`, ans:`\\(D(f) = (-\\infty;\\,-5\\rangle \\cup (0;\\,\\infty)\\)`}
];

/* =========================================================
   LOGIKA — localStorage, progress, accordion, řešení
   ========================================================= */
const LS_PREFIX = 'reparat_mat_';

function lsGet(k){ try{ return localStorage.getItem(LS_PREFIX+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS_PREFIX+k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(LS_PREFIX+k); }catch(e){} }

/* skupiny checklistů, které se počítají do postupu (týdny 1–8 + rezerva). pre-check se počítá zvlášť, ne do týdnů */
const WEEK_GROUPS = [...WEEKS.map(w=>'w'+w.id), 'wrez'];

function initCheckboxes(){
  $$('.check-item input[type=checkbox]').forEach(cb=>{
    const key = cb.dataset.key;
    if(lsGet(key)==='1'){ cb.checked = true; cb.closest('.check-item').classList.add('done'); }
    cb.addEventListener('change',()=>{
      lsSet(key, cb.checked?'1':'0');
      cb.closest('.check-item').classList.toggle('done', cb.checked);
      updateProgress();
    });
  });
}

function groupStats(group){
  const boxes = $$(`.check-item[data-group="${group}"] input`);
  const done = boxes.filter(b=>b.checked).length;
  return {done, total:boxes.length};
}

function updateProgress(){
  /* celkový postup = jen týdenní skupiny (vč. rezervy) */
  let done=0, total=0, weeksDone=0;
  WEEK_GROUPS.forEach(g=>{
    const s = groupStats(g);
    done += s.done; total += s.total;
    if(s.total>0 && s.done===s.total) weeksDone++;
    /* týdenní bar */
    const pct = s.total? Math.round(s.done/s.total*100):0;
    const fill = $('#wfill-'+g.replace('w',''));
    const lbl = $('#wpct-'+g.replace('w',''));
    if(fill) fill.style.width = pct+'%';
    if(lbl) lbl.textContent = pct+' %';
    const card = $('#tyden-'+g.replace('w','')) || (g==='wrez'?$('#rezerva'):null);
    if(card) card.classList.toggle('is-done', s.total>0 && s.done===s.total);
  });

  const pct = total? Math.round(done/total*100):0;

  /* dashboard */
  setText('#sPct', pct, '%');
  setHTML('#sPct', pct+'<small>%</small>');
  setHTML('#sWeeks', weeksDone+'<small>/8</small>');
  setHTML('#sTasks', done+`<small>/${total}</small>`);
  $('#bigPct') && ($('#bigPct').textContent = pct+' %');
  $('#bigFill') && ($('#bigFill').style.width = pct+'%');

  /* topbar mini */
  $('#miniPct') && ($('#miniPct').textContent = pct+' %');
  $('#miniFill') && ($('#miniFill').style.width = pct+'%');
}

function setText(sel,val,suf=''){ const el=$(sel); if(el) el.textContent = val+suf; }
function setHTML(sel,html){ const el=$(sel); if(el) el.innerHTML = html; }

/* aktuální týden podle data + dashboard texty */
function initCurrentWeek(){
  const ranges = [
    {id:1, from:'2026-06-30', to:'2026-07-06'},
    {id:2, from:'2026-07-07', to:'2026-07-13'},
    {id:3, from:'2026-07-14', to:'2026-07-20'},
    {id:4, from:'2026-07-21', to:'2026-07-27'},
    {id:5, from:'2026-07-28', to:'2026-08-03'},
    {id:6, from:'2026-08-04', to:'2026-08-10'},
    {id:7, from:'2026-08-11', to:'2026-08-17'},
    {id:8, from:'2026-08-18', to:'2026-08-23'},
  ];
  const today = new Date();
  let cur = null;
  for(const r of ranges){
    const f=new Date(r.from+'T00:00'), t=new Date(r.to+'T23:59');
    if(today>=f && today<=t){ cur=r.id; break; }
  }
  /* před startem → týden 1; po 23.8. → rezerva */
  let curWeek, watchSource, themeText, datesText;
  if(cur===null){
    if(today < new Date('2026-06-30')) cur = 1;
    else cur = 8;
  }
  const w = WEEKS.find(x=>x.id===cur) || WEEKS[0];
  curWeek = 'Týden '+w.id;
  themeText = w.theme;
  datesText = w.dates;

  setText('#sCur', curWeek);
  $('#bigTheme') && ($('#bigTheme').textContent = themeText);
  $('#bigDates') && ($('#bigDates').textContent = datesText);

  /* watch list = časté chyby aktuálního týdne (max 4) */
  const wl = $('#watchList');
  if(wl){ wl.innerHTML = w.mistakes.slice(0,4).map(m=>`<li>${m}</li>`).join(''); }

  /* big tasks text */
  const updateBigTasks=()=>{
    const s = groupStats('w'+w.id);
    $('#bigTasks') && ($('#bigTasks').textContent = `${s.done} z ${s.total} úkolů týdne`);
  };
  updateBigTasks();
  document.addEventListener('change',e=>{ if(e.target.matches('.check-item input')) updateBigTasks(); });

  /* automaticky rozbal aktuální týden */
  const card = $('#tyden-'+w.id);
  if(card){ openWeek(card); }

  /* countdown */
  const rep = new Date('2026-08-24T08:00');
  const diff = Math.ceil((rep - today)/(1000*60*60*24));
  $('#cdDays') && ($('#cdDays').textContent = diff>0? diff : '0');
}

/* accordion */
function openWeek(card){
  card.classList.add('is-open');
  const btn = card.querySelector('.week-head');
  btn && btn.setAttribute('aria-expanded','true');
}
function initAccordion(){
  $$('.week-head').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const card = btn.closest('.week');
      const open = card.classList.contains('is-open');
      card.classList.toggle('is-open', !open);
      btn.setAttribute('aria-expanded', String(!open));
    });
  });
}

/* řešení – toggle + typeset MathJax na první otevření */
function initSolutions(){
  $$('.solve-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.sol;
      const box = document.getElementById(id);
      if(!box) return;
      const open = box.classList.contains('open');
      box.classList.toggle('open', !open);
      btn.classList.toggle('open', !open);
      btn.querySelector('.ar') && (btn.firstChild); // ponech šipku
      btn.innerHTML = (!open?'<span class="ar" style="transform:rotate(90deg)">▸</span> Skrýt řešení':'<span class="ar">▸</span> Zobrazit řešení');
      if(!open && window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([box]); }
    });
  });
}

/* chybník */
function initChybnik(){
  const ta = $('#chybnikText');
  if(ta){
    const saved = lsGet('chybnik');
    if(saved!==null) ta.value = saved;
    /* autosave on input (debounce) */
    let t;
    ta.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>lsSet('chybnik',ta.value),400); });
  }
  const btn = $('#saveChybnik');
  if(btn){
    btn.addEventListener('click',()=>{
      lsSet('chybnik', ta.value);
      const msg = $('#chybnikSaved');
      msg.classList.add('show');
      setTimeout(()=>msg.classList.remove('show'),1600);
    });
  }
}

/* reset */
function initReset(){
  const btn = $('#resetAll');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    if(!confirm('Opravdu vymazat všechny odškrtané úkoly a chybník? Tahle akce se nedá vrátit.')) return;
    /* smaž všechny klíče prefixu */
    try{
      const keys=[];
      for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(LS_PREFIX)) keys.push(k); }
      keys.forEach(k=>localStorage.removeItem(k));
    }catch(e){}
    /* odškrtni UI */
    $$('.check-item input').forEach(cb=>{ cb.checked=false; cb.closest('.check-item').classList.remove('done'); });
    const ta=$('#chybnikText'); if(ta) ta.value='';
    updateProgress();
  });
}

/* init */
document.addEventListener('DOMContentLoaded',()=>{
  buildHTML();
  initCheckboxes();
  initAccordion();
  initSolutions();
  initChybnik();
  initReset();
  initCurrentWeek();
  updateProgress();
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(); }
});

</script>
